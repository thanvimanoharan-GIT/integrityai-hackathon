// ── Step 4: Live Interview ────────────────────────────────────────────────────
function InterviewScreen({ questions, candidateName, company, sessionId, resumeText, onEnd }) {
  const [ivState, setIvState]               = useState('setup');
  const [elapsed, setElapsed]               = useState(0);
  const [displayText, setDisplayText]       = useState('');
  const [interim, setInterim]               = useState('');
  const [candidateTabSwitches, setCandidateTabSwitches] = useState(0);
  const [currentSpeaker, setCurrentSpeaker] = useState('candidate');
  const [turnScores, setTurnScores]         = useState([]); // [{score, flag, note}]
  const [liveScore, setLiveScore]           = useState(null);
  const [isScoring, setIsScoring]           = useState(false);
  const [askedIds, setAskedIds]             = useState(new Set());
  const [notes, setNotes]                   = useState('');
  const [analyseError, setAnalyseError]     = useState('');
  const [consentReady, setConsentReady]       = useState(false);
  const [consentAuto, setConsentAuto]         = useState(false); // true = came from candidate device
  const [monitorCopied, setMonitorCopied]   = useState(false);
  const [rightTab, setRightTab]             = useState('questions');
  const [currentTurnLatency, setCurrentTurnLatency] = useState(null);
  const [injectedTraps, setInjectedTraps]         = useState([]); // [{id, question, trap_type, target}]
  const [trapDeployed, setTrapDeployed]           = useState(false);
  const [trapBannerVisible, setTrapBannerVisible] = useState(false);
  const [isGeneratingTrap, setIsGeneratingTrap]   = useState(false);
  const trapFiredRef = useRef(false); // fire only once per session
  const turnCountRef = useRef(0);
  // Timing refs
  const candidateTurnStartRef = useRef(null);
  const firstWordReceivedRef  = useRef(false);
  const lastSpeechEventRef    = useRef(null);
  const longestSilenceRef     = useRef(0);

  const isRecordingRef  = useRef(false);
  const transcriptRef   = useRef('');
  const sessionFinalRef = useRef('');
  const speakerRef      = useRef('candidate');
  const timerRef        = useRef(null);
  const recRef          = useRef(null);
  const bcRef           = useRef(null);
  const roomId          = useRef(genRoomId(candidateName));
  const jitsiUrl        = `https://meet.jit.si/${roomId.current}#config.prejoinPageEnabled=false&config.lobby.enabled=false&config.enableLobby=false&config.disableKnocking=true&config.requireDisplayName=false&config.startWithVideoMuted=false&config.startWithAudioMuted=false&config.disableModeratorIndicator=true&config.enableWelcomePage=false&config.disableProfile=true`;
  const jitsiTabUrl     = `https://meet.jit.si/${roomId.current}`;
  // ONE link for candidate — video call + tab monitoring
  const monitorUrl      = `${window.location.origin}?monitor=1&session=${sessionId}&room=${encodeURIComponent(roomId.current)}`;

  // Candidate tab-switch detection via BroadcastChannel (same-machine demo)
  useEffect(() => {
    let bc;
    try { bc = new BroadcastChannel('integrity-ai-signals'); bcRef.current = bc; } catch(e) {}
    if (bc) {
      bc.onmessage = (e) => {
        if (e.data?.session === sessionId) {
          if (e.data.type === 'tab_switch' || e.data.type === 'window_blur') {
            setCandidateTabSwitches(n => n + 1);
          }
          if (e.data.type === 'consent_given') {
            setConsentReady(true);
            setConsentAuto(true);
          }
        }
      };
    }
    return () => { try { bc?.close(); } catch(e) {} };
  }, [sessionId]);

  // Cross-machine consent polling — checks signal API every 3s
  useEffect(() => {
    const id = setInterval(async () => {
      try {
        const res = await fetch(`/api/signal?session=${sessionId}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.consent_given) {
          setConsentReady(true);
          setConsentAuto(true);
        }
      } catch {}
    }, 3000);
    return () => clearInterval(id);
  }, [sessionId]);

  const startSpeech = () => {
    if (!isRecordingRef.current) return;
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    sessionFinalRef.current = '';
    rec.onresult = (e) => {
      let finals = ''; let interimTxt = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finals += e.results[i][0].transcript + ' ';
        else interimTxt += e.results[i][0].transcript;
      }
      sessionFinalRef.current = finals;
      setInterim(interimTxt);
      setDisplayText(transcriptRef.current + finals);
      // Timing: latency to first word + longest mid-answer silence
      if (speakerRef.current === 'candidate') {
        const now = Date.now();
        if (!firstWordReceivedRef.current && candidateTurnStartRef.current) {
          firstWordReceivedRef.current = true;
          setCurrentTurnLatency(now - candidateTurnStartRef.current);
        }
        if (lastSpeechEventRef.current) {
          const gap = now - lastSpeechEventRef.current;
          if (gap > longestSilenceRef.current) longestSilenceRef.current = gap;
        }
        lastSpeechEventRef.current = now;
      }
    };
    rec.onend = () => {
      transcriptRef.current += sessionFinalRef.current;
      sessionFinalRef.current = '';
      setInterim('');
      setDisplayText(transcriptRef.current);
      if (isRecordingRef.current) setTimeout(startSpeech, 300);
    };
    rec.onerror = (e) => { if (e.error==='not-allowed') { alert('Microphone access denied. Please allow microphone access and reload.'); stopRecording(); } };
    recRef.current = rec;
    rec.start();
  };

  const startRecording = () => {
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) { alert('Live transcription requires Google Chrome. Please open this page in Chrome.'); return; }
    // Start transcript with candidate label (most interviews begin with interviewer asking, candidate answering)
    transcriptRef.current = '[CANDIDATE]: ';
    speakerRef.current = 'candidate';
    setCurrentSpeaker('candidate');
    setDisplayText('[CANDIDATE]: ');
    isRecordingRef.current = true;
    setIvState('recording');
    timerRef.current = setInterval(() => setElapsed(n=>n+1), 1000);
    startSpeech();
  };

  // Toggle speaker — commits current session text, scores candidate turns
  const switchSpeaker = async (spk) => {
    // Commit any in-progress speech
    transcriptRef.current += sessionFinalRef.current;
    sessionFinalRef.current = '';
    setInterim('');

    // If switching AWAY from candidate, capture timing + score that turn
    if (speakerRef.current === 'candidate' && spk !== 'candidate') {
      const capturedLatency = currentTurnLatency;
      const capturedSilence = longestSilenceRef.current > 0 ? longestSilenceRef.current : null;
      const lines = transcriptRef.current.split('\n');
      const lastCandLine = [...lines].reverse().find(l => l.startsWith('[CANDIDATE]: '));
      const turnText = lastCandLine ? lastCandLine.replace('[CANDIDATE]: ', '').trim() : '';
      if (turnText.split(' ').length >= 5) {
        turnCountRef.current += 1;
        const turnNum = turnCountRef.current;
        const capturedTurnText = turnText; // capture for trap use
        setIsScoring(true);
        scoreTurn(turnText, turnNum, capturedLatency, capturedSilence).then(result => {
          setIsScoring(false);
          if (result && typeof result.suspicion_score === 'number') {
            setTurnScores(prev => {
              const updated = [...prev, {
                score: result.suspicion_score, flag: result.flag, note: result.note, turn: turnNum,
                latency_ms: capturedLatency, silence_ms: capturedSilence,
                answer_text: capturedTurnText,
              }];
              // ── Dynamic Trap Trigger ──
              // Fire once per session when 2 consecutive turns score > 70
              if (!trapFiredRef.current && updated.length >= 2) {
                const last2 = updated.slice(-2);
                if (last2[0].score > 70 && last2[1].score > 70) {
                  trapFiredRef.current = true;
                  const lastAnswers = last2.map(t => t.answer_text).filter(Boolean);
                  const notes = last2.map(t => t.note).filter(Boolean).join('; ');
                  setIsGeneratingTrap(true);
                  generateTrap(lastAnswers, candidateName, resumeText ? resumeText.substring(0, 400) : '', notes)
                    .then(trap => {
                      setIsGeneratingTrap(false);
                      if (trap && trap.question) {
                        const trapEntry = {
                          id: `trap-dynamic-${Date.now()}`,
                          question: trap.question,
                          trap_type: trap.trap_type || 'pressure',
                          target: trap.target || '',
                          category: 'trap',
                          dynamic: true,
                        };
                        setInjectedTraps(t => [trapEntry, ...t]);
                        setTrapDeployed(true);
                        setTrapBannerVisible(true);
                        setRightTab('questions'); // auto-switch to questions tab
                      }
                    });
                }
              }
              return updated;
            });
            setLiveScore(result.suspicion_score);
          }
        });
      }
    }

    // Switching TO candidate → start timing clock
    if (spk === 'candidate') {
      candidateTurnStartRef.current = Date.now();
      firstWordReceivedRef.current  = false;
      lastSpeechEventRef.current    = null;
      longestSilenceRef.current     = 0;
      setCurrentTurnLatency(null);
    }

    const label = spk === 'interviewer' ? '\n[INTERVIEWER]: ' : '\n[CANDIDATE]: ';
    transcriptRef.current += label;
    speakerRef.current = spk;
    setCurrentSpeaker(spk);
    setDisplayText(transcriptRef.current);
  };

  const stopRecording = () => {
    isRecordingRef.current = false;
    clearInterval(timerRef.current);
    recRef.current?.stop();
    transcriptRef.current += sessionFinalRef.current;
    sessionFinalRef.current = '';
    setInterim('');
    setDisplayText(transcriptRef.current);
  };

  const handleEndAndAnalyse = async () => {
    stopRecording();
    setIvState('analysing');
    setAnalyseError('');
    try {
      const trapQuestions = questions.filter(q=>q.trap_type).map(q=>q.question);
      const fullTranscript = transcriptRef.current;
      // Extract only candidate speech for AI scoring
      const candidateLines = fullTranscript
        .split('\n')
        .filter(line => line.startsWith('[CANDIDATE]: '))
        .map(line => line.replace('[CANDIDATE]: ', '').trim())
        .filter(Boolean);
      const candidateText = candidateLines.join(' ');
      // Use candidate-only text, fallback to full transcript, fallback to placeholder
      const transcriptForAI = candidateText.trim().length > 20
        ? candidateText
        : fullTranscript.trim().length > 20
          ? fullTranscript
          : '[No speech was recorded during this session — manual review required]';
      const report = await scoreInterview({
        transcript: transcriptForAI,
        candidate_name: candidateName,
        trap_questions: trapQuestions,
        tab_switches: candidateTabSwitches,
        duration_seconds: elapsed,
        role: company || '',
        interviewer_notes: notes,
        resume_text: resumeText || '',
      });
      onEnd({ transcript: fullTranscript, candidateTranscript: candidateText, tabSwitches: candidateTabSwitches, elapsed, notes, report, turnScores, injectedTraps });
    } catch (err) {
      setAnalyseError('Analysis failed: ' + err.message + ' — check your internet connection and try again.');
      setIvState('report-error');
    }
  };

  const meterClass = (s) => s === null ? '' : s <= 40 ? 'low' : s <= 70 ? 'medium' : 'high';

  const copyMonitor = () => { navigator.clipboard.writeText(monitorUrl); setMonitorCopied(true); setTimeout(()=>setMonitorCopied(false),2500); };
  const toggleAsked = (id) => setAskedIds(prev => { const s=new Set(prev); s.has(id)?s.delete(id):s.add(id); return s; });
  // Count only candidate words for display
  const candidateLines = displayText.split('\n').filter(l=>l.startsWith('[CANDIDATE]: ')).map(l=>l.replace('[CANDIDATE]: ','')).join(' ');
  const wordCount = candidateLines.trim() ? candidateLines.trim().split(/\s+/).length : 0;

  // ── Analysing state ──
  if (ivState === 'report-error') return (
    <div className="loading-card">
      <div style={{fontSize:40,marginBottom:16}}>⚠️</div>
      <div className="loading-title" style={{color:'#ef4444'}}>Analysis Failed</div>
      <div className="error-box" style={{marginTop:16,textAlign:'left'}}>{analyseError}</div>
      <div style={{display:'flex',gap:12,marginTop:24,justifyContent:'center'}}>
        <button className="btn btn-primary" onClick={()=>{ setIvState('recording'); setAnalyseError(''); }}>↩ Return to Interview</button>
        <button className="btn btn-danger" onClick={()=>{ setAnalyseError(''); handleEndAndAnalyse(); }}>🔄 Retry Analysis</button>
      </div>
    </div>
  );

  if (ivState === 'analysing') return (
    <div className="loading-card">
      <div className="spinner spinner-purple" />
      <div className="loading-title">Analysing interview…</div>
      <div className="loading-sub" style={{marginTop:10}}>AI is reading the full transcript and checking for scripted language, vocabulary shifts, fake tool responses, and authenticity signals. About 10–15 seconds.</div>
      {analyseError && <div className="error-box" style={{marginTop:20}}>⚠️ {analyseError}</div>}
    </div>
  );

  return (
    <div className="iv-wrap">
      {/* Status bar */}
      <div className="iv-statusbar">
        <div className="iv-status-left">
          {ivState==='recording'
            ? <div className="rec-badge"><div className="rec-dot"/>REC</div>
            : <div style={{fontSize:12,color:'#475569',fontWeight:600}}>⏸ SETUP</div>}
          <div className={`iv-timer ${ivState==='setup'?'idle':''}`}>{formatTime(elapsed)}</div>
          <div className="iv-meta">Candidate: <strong>{candidateName}</strong>{company&&<> · <strong>{company}</strong></>}</div>
          <div className="priv-note">🔒 Interviewer view — keep private from candidate</div>
        </div>
        <div className="iv-status-right">
          <div className={`tab-pill ${candidateTabSwitches===0?'ok':'warn'}`}>
            {candidateTabSwitches===0?'✓ Candidate focused':`⚠ Candidate: ${candidateTabSwitches} tab switch${candidateTabSwitches>1?'es':''}`}
          </div>
        </div>
      </div>

      {/* Setup Panel */}
      {ivState === 'setup' && (
        <div className="iv-setup-panel">
          <div className="iv-setup-title">Get ready to start</div>

          {/* STEP 1 — Share link */}
          <div style={{display:'flex',gap:14,alignItems:'flex-start',marginBottom:20}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'#6366f1',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color:'#fff',flexShrink:0,marginTop:2}}>1</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'#e2e8f0',marginBottom:8}}>Share this link with the candidate</div>
              <div className="room-link-row">
                <div className="room-link-text" title={monitorUrl}>{monitorUrl}</div>
                <button className="btn btn-ghost btn-sm" onClick={copyMonitor}>{monitorCopied?'✓ Copied!':'Copy Link'}</button>
                <a href={`https://mail.google.com/mail/?view=cm&su=${encodeURIComponent('Your Interview Link — ' + (candidateName||'Candidate'))}&body=${encodeURIComponent('Hi ' + (candidateName||'there') + ',\n\nPlease use the link below to join your interview. It will open the video call and includes a short consent step before we begin.\n\n' + monitorUrl + '\n\nPlease keep this tab open throughout the interview.\n\nBest regards')}`}
                  target="_blank" rel="noopener noreferrer"
                  style={{padding:'5px 12px',fontSize:12,fontWeight:700,color:'#6366f1',background:'rgba(99,102,241,.1)',border:'1px solid rgba(99,102,241,.25)',borderRadius:6,textDecoration:'none',whiteSpace:'nowrap'}}>
                  ✉ Gmail
                </a>
              </div>
              <div style={{fontSize:12,color:'#475569',marginTop:6,lineHeight:1.5}}>
                One link — opens their video call, shows consent form, and monitors tab switches. Send via email or chat before the interview.
              </div>
            </div>
          </div>

          {/* STEP 2 — Consent gate */}
          <div style={{display:'flex',gap:14,alignItems:'flex-start',marginBottom:20}}>
            <div style={{width:28,height:28,borderRadius:'50%',background: consentReady?'#10b981':'#1e2330',border: consentReady?'none':'2px solid #2d3446',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color: consentReady?'#fff':'#475569',flexShrink:0,marginTop:2,transition:'all .4s'}}>2</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'#e2e8f0',marginBottom:8}}>Wait for candidate consent</div>
              {consentReady ? (
                <div style={{background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.3)',borderRadius:8,padding:'10px 16px',display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontSize:18}}>✅</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:'#10b981'}}>Consent confirmed</div>
                    <div style={{fontSize:11,color:'#6ee7b7',marginTop:2}}>{consentAuto ? 'Candidate tapped "I Consent" on their device — received automatically' : 'Confirmed manually'}</div>
                  </div>
                </div>
              ) : (
                <div style={{background:'#0d0f14',border:'1px solid #1e2330',borderRadius:8,padding:'14px 16px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:'#fbbf24',animation:'blink .8s ease-in-out infinite alternate'}} />
                    <span style={{fontSize:13,color:'#94a3b8'}}>Waiting for candidate to tap <strong style={{color:'#e2e8f0'}}>"I Consent"</strong> on their link…</span>
                  </div>
                  <div style={{fontSize:11,color:'#475569',marginBottom:12}}>The button will light up automatically once they confirm. No action needed from you.</div>
                  <button onClick={()=>setConsentReady(true)} style={{fontSize:12,color:'#94a3b8',background:'transparent',border:'1px solid #2d3446',borderRadius:6,padding:'5px 12px',cursor:'pointer'}}>
                    I confirmed consent verbally — proceed anyway
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* STEP 3 — Video call */}
          <div style={{display:'flex',gap:14,alignItems:'flex-start',marginBottom:24}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'#1e2330',border:'2px solid #2d3446',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color:'#475569',flexShrink:0,marginTop:2}}>3</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700,color:'#e2e8f0'}}>Video call — confirm candidate is visible</div>
                <a href={jitsiTabUrl} target="_blank" rel="noreferrer"
                  style={{fontSize:11,fontWeight:700,color:'#6366f1',background:'rgba(99,102,241,.12)',padding:'4px 10px',borderRadius:6,textDecoration:'none',border:'1px solid rgba(99,102,241,.3)'}}>
                  ↗ Open in new tab
                </a>
              </div>
              <div style={{borderRadius:8,overflow:'hidden',border:'1px solid #1e2330'}}>
                <iframe src={jitsiUrl} style={{width:'100%',height:280,border:'none',display:'block'}}
                  allow="camera *; microphone *; fullscreen *; display-capture *; screen-wake-lock *" allowFullScreen />
              </div>
              <div style={{fontSize:11,color:'#475569',marginTop:6}}>
                If you see a waiting screen, tap <strong style={{color:'#94a3b8'}}>↗ Open in new tab</strong> above to join the call in a full browser tab.
              </div>
            </div>
          </div>

          {/* Start button */}
          <div style={{borderTop:'1px solid #1e2330',paddingTop:20,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
            <div style={{fontSize:12,color:'#475569',lineHeight:1.5}}>
              ⚠ <strong style={{color:'#64748b'}}>Audio tip:</strong> Use speakers or a shared room for best transcript quality.
            </div>
            <button className="btn btn-green btn-auto" onClick={startRecording}
              disabled={!consentReady}
              style={{opacity: consentReady?1:.35, transition:'opacity .3s'}}>
              🔴 Start Recording Interview
            </button>
          </div>
        </div>
      )}

      {/* Live Suspicion Meter — full-width panel, always visible during recording */}
      {ivState === 'recording' && (() => {
        const sc = meterClass(liveScore);
        const riskLabel = { low:'LOW RISK', medium:'MEDIUM RISK', high:'HIGH RISK' };
        return (
          <div className="susp-panel">
            <div className="susp-left">
              <div className="susp-lbl">📊 LIVE SUSPICION</div>
              <div className={`susp-score ${liveScore===null?'idle':sc}`}>
                {isScoring ? '…' : liveScore !== null ? liveScore : '—'}
              </div>
              <div className={`susp-risk-lbl ${liveScore===null?'idle':sc}`}>
                {isScoring ? 'Scoring…' : liveScore !== null ? riskLabel[sc] : 'Waiting for first answer'}
              </div>
            </div>
            <div className="susp-center">
              <div className="susp-track">
                <div className={`susp-fill ${liveScore===null?'idle':sc}`} style={{width: liveScore!==null?`${liveScore}%`:'0%'}} />
              </div>
              <div className="susp-dots">
                {[...Array(8)].map((_,i) => {
                  const t = turnScores[i];
                  const latStr = t?.latency_ms!=null ? `⏱ ${Math.round(t.latency_ms/1000)}s` : '';
                  const silStr = t?.silence_ms!=null  ? `🔇 ${Math.round(t.silence_ms/1000)}s pause` : '';
                  const tip = [latStr,silStr].filter(Boolean).join(' · ');
                  return <div key={i} className={`susp-dot ${t?meterClass(t.score):'empty'}`}
                    title={t?`Turn ${t.turn}: ${t.score}/100\n${t.note}${tip?'\n'+tip:''}`:'Not yet scored'} />;
                })}
                {turnScores.length > 0 && <span style={{fontSize:10,color:'#475569',marginLeft:4}}>{turnScores.length} turn{turnScores.length>1?'s':''} scored</span>}
              </div>
            </div>
            <div className="susp-right">
              {isScoring && <div className="susp-scoring">🔄 Analysing last answer…</div>}
              {!isScoring && turnScores.length > 0 && (() => {
                const last = turnScores[turnScores.length-1];
                const latSec = last.latency_ms!=null ? Math.round(last.latency_ms/1000) : null;
                const silSec = last.silence_ms!=null  ? Math.round(last.silence_ms/1000)  : null;
                const latColor = latSec==null?'#475569': latSec>20?'#ef4444': latSec>10?'#fbbf24':'#10b981';
                const silColor = silSec==null?'#475569': silSec<2?'#ef4444': silSec<5?'#fbbf24':'#10b981';
                return (
                  <div style={{display:'flex',flexDirection:'column',gap:5}}>
                    {last.note && <div className="susp-note">"{last.note}"</div>}
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                      {latSec!=null && <span style={{fontSize:11,fontWeight:700,color:latColor,background:'rgba(0,0,0,.35)',padding:'2px 8px',borderRadius:6}}
                        title="Time from question end to first word — >15s may indicate reading from a source">⏱ {latSec}s to respond{latSec>15?' ⚠':''}</span>}
                      {silSec!=null && <span style={{fontSize:11,fontWeight:700,color:silColor,background:'rgba(0,0,0,.35)',padding:'2px 8px',borderRadius:6}}
                        title="Longest mid-answer gap — <2s in a long answer suggests reading fluently">🔇 {silSec}s max pause{silSec<2?' ⚠':''}</span>}
                    </div>
                  </div>
                );
              })()}
              {!isScoring && turnScores.length === 0 &&
                <div className="susp-hint">Click <strong style={{color:'#6366f1'}}>🎙 You (Interviewer)</strong> after the candidate finishes each answer to score that turn.</div>}
            </div>
          </div>
        );
      })()}

      {/* Active interview body */}
      {ivState === 'recording' && (
        <div className="iv-body">
          {/* Left: Video + Transcript */}
          <div className="iv-left">
            <div className="video-card">
              <div className="video-label">📹 VIDEO CALL</div>
              <iframe
                className="jitsi-frame"
                src={jitsiUrl}
                allow="camera *; microphone *; fullscreen *; display-capture *; screen-wake-lock *"
                allowFullScreen
              />
            </div>
            <div className="transcript-card">
              <div className="transcript-label">
                <span>🎙 LIVE TRANSCRIPT</span>
                <div className="rec-live"><div className="rec-live-dot"/>RECORDING</div>
              </div>
              {/* Speaker toggle — click before each person speaks */}
              <div className="speaker-toggle">
                <span className="spk-lbl">NOW SPEAKING:</span>
                <button className={`spk-btn spk-btn-interviewer ${currentSpeaker==='interviewer'?'active':''}`}
                  onClick={()=>switchSpeaker('interviewer')}>🎙 You (Interviewer)</button>
                <button className={`spk-btn spk-btn-candidate ${currentSpeaker==='candidate'?'active':''}`}
                  onClick={()=>switchSpeaker('candidate')}>👤 Candidate</button>
                <span style={{fontSize:10,color:'#2d3446',marginLeft:4}}>Click when speaker changes</span>
              </div>
              <div className="transcript-body">
                {(displayText||interim) ? (() => {
                  // Render color-coded transcript segments
                  const lines = (displayText + (interim ? interim : '')).split('\n').filter(Boolean);
                  return lines.map((line, i) => {
                    if (line.startsWith('[CANDIDATE]: ')) {
                      const txt = line.replace('[CANDIDATE]: ','');
                      return <span key={i} className="tx-block tx-candidate"><span className="tx-candidate-lbl">CANDIDATE</span>{txt}{i===lines.length-1&&interim?<span className="transcript-interim"> {interim}</span>:''}</span>;
                    }
                    if (line.startsWith('[INTERVIEWER]: ')) {
                      const txt = line.replace('[INTERVIEWER]: ','');
                      return <span key={i} className="tx-block tx-interviewer"><span className="tx-interviewer-lbl">INTERVIEWER</span>{txt}</span>;
                    }
                    return <span key={i} className="tx-block" style={{color:'#475569'}}>{line}</span>;
                  });
                })() : (
                  <span className="transcript-empty">Listening… click the speaker button above before each person speaks. Candidate words are highlighted in white.</span>
                )}
              </div>
              {wordCount > 0 && <div className="word-count">{wordCount} candidate words captured</div>}
            </div>
          </div>

          {/* Right: Tabbed panel — Questions / Notes */}
          <div className="iv-right">
            <div className="right-panel-tabbed">
              {/* Tab bar */}
              <div className="rpt-tabs">
                <button className={`rpt-tab ${rightTab==='questions'?'active':''}`} onClick={()=>setRightTab('questions')}>
                  💡 Questions ({questions.length + injectedTraps.length})
                  {trapDeployed && <span className="trap-deployed-badge">⚠ TRAP</span>}
                </button>
                <button className={`rpt-tab ${rightTab==='notes'?'active':''}`} onClick={()=>setRightTab('notes')}>
                  📝 Notes{notes.trim()?` ✦`:''}
                </button>
              </div>

              {/* Questions tab */}
              {rightTab === 'questions' && (
                <div className="rpt-tab-content">
                  <div style={{padding:'8px 14px 6px',borderBottom:'1px solid #1e2330',fontSize:10,color:'#2d3446'}}>
                    Ask in your own words · Click to mark as covered · 🎣 = trap · ⚠ = AI-generated trap
                  </div>

                  {/* Trap banner — shown when a dynamic trap was just deployed */}
                  {trapBannerVisible && (
                    <div className="trap-banner" style={{margin:'8px 10px 0'}}>
                      <div className="trap-banner-left">
                        <span className="trap-banner-icon">⚠</span>
                        <div>
                          <div className="trap-banner-text">TRAP DEPLOYED</div>
                          <div className="trap-banner-sub">High suspicion detected · AI generated a pressure question — ask it now</div>
                        </div>
                      </div>
                      <button className="trap-banner-close" onClick={()=>setTrapBannerVisible(false)}>✕</button>
                    </div>
                  )}

                  {/* Generating trap spinner */}
                  {isGeneratingTrap && (
                    <div className="trap-generating">
                      <div className="trap-spinner" />
                      <span>⚠ High suspicion detected — generating pressure trap question…</span>
                    </div>
                  )}

                  <div className="rpt-questions-scroll">
                    {/* Injected dynamic traps — shown at the TOP */}
                    {injectedTraps.map((q) => (
                      <div key={q.id} className={`q-sugg is-dynamic-trap ${askedIds.has(q.id)?'asked':''}`} onClick={()=>toggleAsked(q.id)}>
                        <div style={{fontSize:10,fontWeight:700,color:'#f59e0b',marginBottom:5,display:'flex',alignItems:'center',gap:5}}>
                          ⚠ AI-GENERATED PRESSURE TRAP
                        </div>
                        <div className={`q-sugg-text ${askedIds.has(q.id)?'crossed':''}`}>{q.question}</div>
                        {q.target && <div className="q-trap-target">🎯 {q.target}</div>}
                        <div className="q-sugg-foot" style={{marginTop:6}}>
                          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                            <span className="qb qb-trap">TRAP</span>
                            <span className="qb qb-traptype">{TRAP_LABELS[q.trap_type]||q.trap_type}</span>
                            <span style={{fontSize:10,fontWeight:700,color:'#f59e0b',background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.25)',padding:'2px 6px',borderRadius:4}}>⚡ DYNAMIC</span>
                          </div>
                          {askedIds.has(q.id) && <span className="q-asked-mark">✓ Asked</span>}
                        </div>
                      </div>
                    ))}

                    {/* Divider if we have injected traps */}
                    {injectedTraps.length > 0 && (
                      <div style={{padding:'6px 14px',fontSize:10,color:'#2d3446',borderBottom:'1px solid #1e2330',background:'#0d0f14'}}>
                        — Original question bank —
                      </div>
                    )}

                    {questions.map((q) => (
                      <div key={q.id||q.question} className={`q-sugg ${askedIds.has(q.id)?'asked':''} ${q.trap_type?'is-trap':''}`} onClick={()=>toggleAsked(q.id)}>
                        <div className={`q-sugg-text ${askedIds.has(q.id)?'crossed':''}`}>{q.question}</div>
                        <div className="q-sugg-foot">
                          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                            <span className={`qb qb-${q.category}`}>{q.category.toUpperCase()}</span>
                            {q.trap_type && <span className="qb qb-traptype">{TRAP_LABELS[q.trap_type]}</span>}
                          </div>
                          {askedIds.has(q.id) && <span className="q-asked-mark">✓ Asked</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Notes tab */}
              {rightTab === 'notes' && (
                <div className="rpt-tab-content rpt-notes-area">
                  <div style={{padding:'8px 14px 6px',borderBottom:'1px solid #1e2330',fontSize:10,color:'#2d3446'}}>
                    Private · Not visible to candidate · Included in final report
                  </div>
                  <textarea
                    className="rpt-notes-textarea"
                    placeholder="Type observations during the interview…&#10;&#10;e.g. Hesitated on the React hooks question. Very rehearsed on teamwork answers — almost word-perfect. Stumbled when I asked for the exact error message."
                    value={notes}
                    onChange={e=>setNotes(e.target.value)}
                  />
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Bottom bar */}
      {ivState === 'recording' && (
        <div className="iv-bottombar">
          <div className="iv-bottom-hint">🔴 Recording · {formatTime(elapsed)} elapsed · {wordCount} candidate words · {candidateTabSwitches > 0 ? `⚠ ${candidateTabSwitches} candidate tab switch${candidateTabSwitches>1?'es':''}` : '✓ Candidate focused'}</div>
          <div className="iv-bottom-right">
            <button className="btn btn-ghost btn-sm" onClick={()=>{stopRecording();setElapsed(0);setDisplayText('');transcriptRef.current='';setIvState('setup');}}>↩ Reset</button>
            <button className="btn btn-danger btn-auto" onClick={handleEndAndAnalyse}>⏹ End &amp; Analyse Interview</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Step 5: Integrity Report ──────────────────────────────────────────────────
function IntegrityReport({ result, interviewData, role, company, sessionId, onReset }) {
  const [showTranscript, setShowTranscript] = useState(false);
  const [ivVerdict, setIvVerdict]           = useState(null); // 'hire'|'hold'|'reject'
  const [ivJustification, setIvJustification] = useState('');
  const [decisionLocked, setDecisionLocked] = useState(false);
  const { transcript, tabSwitches, elapsed, notes, report, injectedTraps } = interviewData;
  const s = report?.integrity_score;
  const dateStr = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});

  const verdictLabels = { hire: '✅ HIRE', hold: '⏸ HOLD', reject: '❌ REJECT' };
  const lockDecision = () => { if (ivVerdict) setDecisionLocked(true); };

  if (!report) return (
    <div className="card" style={{maxWidth:640}}>
      <div className="card-title">Interview Complete</div>
      <div className="card-sub">AI scoring was unavailable. Raw transcript saved below.</div>
      <div style={{fontSize:13,color:'#94a3b8',lineHeight:1.8,maxHeight:300,overflowY:'auto',padding:'12px 0'}}>{transcript||'No transcript captured.'}</div>
      <div style={{display:'flex',gap:10,marginTop:20}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>downloadJSON(interviewData,`interview-${sessionId}.json`)}>Export</button>
        <button className="btn btn-ghost btn-sm" onClick={onReset}>New Candidate</button>
      </div>
    </div>
  );

  return (
    <div className="report-wrap">
      {/* Header */}
      <div className="report-toprow">
        <div>
          <div className="report-heading">Integrity Report</div>
          <div className="report-sub">
            <strong style={{color:'#e2e8f0'}}>{result.candidate_name}</strong>
            {role && <> · {role}</>}
            {company && <> @ {company}</>}
            {' '}· {dateStr} · {formatTime(elapsed)}
            {tabSwitches > 0 && <span style={{color:'#fbbf24'}}> · ⚠ Candidate switched tab {tabSwitches} time{tabSwitches>1?'s':''}</span>}
          </div>
          <div className="session-id">Session: {sessionId}</div>
          {injectedTraps && injectedTraps.length > 0 && (
            <div style={{marginTop:6,fontSize:11,color:'#f59e0b',background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.25)',borderRadius:6,padding:'4px 10px',display:'inline-block'}}>
              ⚠ {injectedTraps.length} AI-generated trap{injectedTraps.length>1?'s':''} deployed during interview
            </div>
          )}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>window.print()}>🖨 Print / PDF</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>downloadJSON({candidate:result.candidate_name,role,company,session_id:sessionId,report,transcript,notes,interviewer_decision:{verdict:ivVerdict,justification:ivJustification,locked:decisionLocked}},`integrity-report-${sessionId}.json`)}>Export JSON</button>
          <button className="btn btn-ghost btn-sm" onClick={onReset}>New Candidate</button>
        </div>
      </div>

      {/* Interviewer Decision — locked block shown at top when confirmed */}
      {decisionLocked && ivVerdict && (
        <div className={`ivd-locked ivd-locked-${ivVerdict}`}>
          <div className={`ivd-locked-badge ${ivVerdict}`}>{verdictLabels[ivVerdict]}</div>
          <div className="ivd-locked-body">
            <div className="ivd-locked-lbl">INTERVIEWER DECISION</div>
            {ivJustification.trim()
              ? <div className="ivd-locked-text">"{ivJustification.trim()}"</div>
              : <div className="ivd-locked-text" style={{color:'#475569',fontStyle:'italic'}}>No written justification provided.</div>}
            <div className="ivd-locked-meta">Confirmed by interviewer · {dateStr} · Session {sessionId}</div>
          </div>
        </div>
      )}

      {/* AI Verdict */}
      <div className="verdict-card">
        <div className="score-col">
          <div className="score-lbl">INTEGRITY SCORE</div>
          <div className={`score-num ${scoreColor(s)}`}>{s}<span style={{fontSize:28,fontWeight:400}}>/100</span></div>
          <div className="score-track"><div className={`score-fill ${fillClass(s)}`} style={{width:`${s}%`}}/></div>
        </div>
        <div className="verdict-col">
          <div className={`rec-pill ${recClass(report.recommendation)}`}>{recLabel(report.recommendation)}</div>
          <div className="rec-reason">{report.recommendation_reason}</div>
        </div>
      </div>

      {/* AI Assessment */}
      {report.overall_assessment && (
        <div className="assessment-box">
          <div className="assessment-lbl">🧠 AI ASSESSMENT</div>
          <div className="assessment-text">{report.overall_assessment}</div>
        </div>
      )}

      {/* Flags */}
      {report.flags?.length > 0 && <>
        <div className="section-title">⚑ Suspicion Flags ({report.flags.length})</div>
        <div className="flags-list">
          {report.flags.map((f,i) => (
            <div key={i} className="flag-item">
              <span className={`flag-sev sev-${f.severity}`}>{f.severity.toUpperCase()}</span>
              <div className="flag-body">
                <div className="flag-detail">{f.detail}</div>
                <div className="flag-type-lbl">{f.type?.replace(/_/g,' ')}</div>
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* Notable quotes */}
      {report.notable_quotes?.length > 0 && <>
        <div className="section-title">💬 Suspicious Quotes</div>
        <div className="quotes-list">
          {report.notable_quotes.map((q,i) => (
            <div key={i} className="quote-item">
              <div className="quote-text">"{q.quote}"</div>
              <div className="quote-note">⚠ {q.why_suspicious}</div>
            </div>
          ))}
        </div>
      </>}

      {/* Interviewer notes */}
      {notes?.trim() && <>
        <div className="section-title">📝 Interviewer Notes</div>
        <div className="notes-in-report"><div className="notes-content">{notes}</div></div>
      </>}

      {/* Interviewer Decision Input — shown until locked */}
      {!decisionLocked && (
        <div className="ivd-section">
          <div className="ivd-title">👤 YOUR DECISION</div>
          <div className="ivd-subtitle">Record your hiring decision independently. This is separate from the AI score and will appear at the top of the report once confirmed.</div>
          <div className="ivd-btns">
            {['hire','hold','reject'].map(v => (
              <button key={v}
                className={`ivd-btn ivd-btn-${v} ${ivVerdict===v?'selected':''}`}
                onClick={() => setIvVerdict(v)}>
                {verdictLabels[v]}
              </button>
            ))}
          </div>
          <textarea
            className="ivd-textarea"
            placeholder="Write your justification here…&#10;e.g. Strong technical depth confirmed under pressure. Hesitated on React hooks question but recovered well — genuine knowledge. Inconsistency on the AWS experience is worth a follow-up call."
            value={ivJustification}
            onChange={e => setIvJustification(e.target.value)}
          />
          <button className="ivd-lock-btn" disabled={!ivVerdict} onClick={lockDecision}>
            🔒 Confirm &amp; Lock Decision
          </button>
          {!ivVerdict && <span style={{fontSize:11,color:'#475569',marginLeft:12}}>Select a verdict above first</span>}
        </div>
      )}

      {/* Transcript */}
      {transcript && (
        <div className="transcript-collapsible">
          <button className="transcript-toggle" onClick={()=>setShowTranscript(!showTranscript)}>
            <span>📄 Full Interview Transcript ({transcript.trim().split(/\s+/).length} words)</span>
            <span>{showTranscript?'▲ Hide':'▼ Show'}</span>
          </button>
          {showTranscript && <div className="transcript-full">{transcript}</div>}
        </div>
      )}

      <div className="report-actions">
        <div style={{fontSize:12,color:'#2d3446',marginRight:'auto'}}>
          Powered by IntegrityAI · AI analysis at 4 stages: question generation, answer scoring, trap detection, final report
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>window.print()}>🖨 Print / Save as PDF</button>
        <button className="btn btn-ghost btn-sm" onClick={onReset}>New Candidate</button>
      </div>
    </div>
  );
}

// ── Candidate Monitor Page ────────────────────────────────────────────────────
// Shown when candidate opens ?monitor=1&session=SESSION_ID
function CandidateMonitor({ sessionId, roomId }) {
  const [tabCount, setTabCount]   = useState(0);
  const [consented, setConsented] = useState(false);
  const [bcRef] = useState(() => { try { return new BroadcastChannel('integrity-ai-signals'); } catch(e) { return null; } });
  const jitsiSrc = roomId ? `https://meet.jit.si/${roomId}#config.prejoinPageEnabled=false&config.lobby.enabled=false&config.enableLobby=false&config.disableKnocking=true&config.requireDisplayName=false&userInfo.displayName=Candidate` : '';

  React.useEffect(() => {
    const onVis = () => {
      if (document.hidden) {
        const next = tabCount + 1;
        setTabCount(next);
        if (bcRef) bcRef.postMessage({ type: 'tab_switch', count: next, session: sessionId });
        fetch('/api/signal', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ session: sessionId, type: 'tab_switch', count: next }) }).catch(()=>{});
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [tabCount, sessionId, bcRef]);

  const handleConsent = () => {
    setConsented(true);
    fetch('/api/signal', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session: sessionId, type: 'consent_given' }) }).catch(()=>{});
    if (bcRef) bcRef.postMessage({ type: 'consent_given', session: sessionId });
  };

  if (!consented) return (
    <div style={{minHeight:'100vh',background:'#0d0f14',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#1a1f2e',border:'1px solid rgba(99,102,241,.3)',borderRadius:12,padding:40,maxWidth:480,width:'100%',textAlign:'center'}}>
        <div style={{fontSize:32,marginBottom:12}}>🛡️</div>
        <h2 style={{color:'#e2e8f0',fontSize:20,fontWeight:700,marginBottom:12}}>IntegrityAI — Candidate Interview</h2>
        <p style={{color:'#94a3b8',fontSize:14,lineHeight:1.6,marginBottom:8}}>This session uses behavioural analysis to support interview integrity.</p>
        <p style={{color:'#94a3b8',fontSize:13,lineHeight:1.6,marginBottom:24}}>No audio or video is stored. Tab switches are logged. Your responses are analysed for authenticity signals only.</p>
        <button onClick={handleConsent} style={{background:'#6366f1',color:'white',border:'none',borderRadius:8,padding:'14px 32px',fontSize:15,fontWeight:700,cursor:'pointer',width:'100%',marginBottom:12}}>
          ✓ I Consent — Proceed to Interview
        </button>
        <p style={{color:'#475569',fontSize:11,marginTop:8}}>By clicking above you confirm you have read and agree to the monitoring terms for this session.</p>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'#0d0f14',display:'flex',flexDirection:'column'}}>
      <div style={{background:'#1a1f2e',borderBottom:'1px solid rgba(255,255,255,.08)',padding:'10px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{color:'#6366f1',fontWeight:700,fontSize:14}}>🛡️ IntegrityAI</span>
          <span style={{color:'#64748b',fontSize:11,letterSpacing:1}}>CANDIDATE VIEW</span>
        </div>
        {tabCount > 0 && (
          <div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.4)',borderRadius:6,padding:'4px 10px',fontSize:12,color:'#f87171',fontWeight:700}}>
            ⚠ {tabCount} tab switch{tabCount !== 1 ? 'es' : ''} logged
          </div>
        )}
      </div>
      <div style={{background:'rgba(5,150,105,.1)',borderBottom:'1px solid rgba(5,150,105,.2)',padding:'8px 20px',fontSize:12,color:'#34d399',textAlign:'center'}}>
        ✓ Consent recorded — keep this tab visible throughout the interview. Switching tabs is logged.
      </div>
      <div style={{background:'rgba(0,0,0,.3)',borderBottom:'1px solid rgba(255,255,255,.05)',padding:'6px 20px',fontSize:11,color:'#64748b',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>Video call below — if it shows a waiting screen, open it in a new tab instead</span>
        {jitsiSrc && (
          <a href={jitsiSrc} target="_blank" rel="noopener noreferrer"
            style={{color:'#818cf8',fontSize:11,textDecoration:'none',fontWeight:600,whiteSpace:'nowrap',marginLeft:12}}>
            ↗ Open video call in new tab
          </a>
        )}
      </div>
      <div style={{flex:1}}>
        {jitsiSrc
          ? <iframe src={jitsiSrc} style={{width:'100%',height:'100%',border:'none',minHeight:'calc(100vh - 106px)'}} allow="camera *; microphone *; display-capture *" />
          : <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:300,color:'#64748b'}}>No room provided.</div>
        }
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const params      = new URLSearchParams(window.location.search);
  const isMonitor   = params.get('monitor') === '1';
  const monitorSid  = params.get('session') || 'demo';
  const roomId      = params.get('room')    || '';

  if (isMonitor) return <CandidateMonitor sessionId={monitorSid} roomId={roomId} />;

  const [step,         setStep]         = useState('step1');
  const [loadingStep,  setLoadingStep]  = useState(0);
  const [loadError,    setLoadError]    = useState('');
  const [qbResult,     setQbResult]     = useState(null);
  const [filename,     setFilename]     = useState('');
  const [role,         setRole]         = useState('');
  const [company,      setCompany]      = useState('');
  const [sessionId,    setSessionId]    = useState('');
  const [resumeText,   setResumeText]   = useState('');
  const [interviewData,setInterviewData]= useState(null);

  const handleStart = async (file, roleVal, companyVal) => {
    setLoadError('');
    setRole(roleVal);
    setCompany(companyVal);
    setFilename(file.name);
    setSessionId(genSessionId());
    setStep('loading');
    setLoadingStep(0);
    try {
      setLoadingStep(1);
      const text = await parsePDF(file);
      setResumeText(text);
      setLoadingStep(2);
      const result = await generateQuestions(text, roleVal, companyVal);
      setLoadingStep(3);
      setQbResult(result);
      setStep('step3');
    } catch (err) {
      setLoadError(err.message || 'Something went wrong. Please try again.');
      setStep('step1');
    }
  };

  const handleReset = () => {
    setStep('step1');
    setQbResult(null);
    setFilename('');
    setRole('');
    setCompany('');
    setSessionId('');
    setResumeText('');
    setInterviewData(null);
    setLoadError('');
  };

  if (step === 'step1')    return <Step1 onStart={handleStart} error={loadError} />;
  if (step === 'loading')  return <Step2 loadingStep={loadingStep} />;
  if (step === 'step3')    return <Step3 result={qbResult} filename={filename} role={role} company={company} onReset={handleReset} onStartInterview={() => setStep('interview')} />;
  if (step === 'interview') return <InterviewScreen questions={qbResult.questions} candidateName={qbResult.candidate_name} company={company} sessionId={sessionId} resumeText={resumeText} onEnd={(data) => { setInterviewData(data); setStep('report'); }} />;
  if (step === 'report')   return <IntegrityReport result={qbResult} interviewData={interviewData} role={role} company={company} sessionId={sessionId} onReset={handleReset} />;
  return null;
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
