<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntegrityAI — Interview Authenticity Detector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0f14; color: #e2e8f0; min-height: 100vh; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #12151d; border-bottom: 1px solid #1e2330; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-size: 18px; font-weight: 700; }
    .logo-text span { color: #a855f7; }
    .badge { font-size: 11px; font-weight: 600; letter-spacing: .5px; background: #1e2330; border: 1px solid #2d3446; padding: 3px 10px; border-radius: 20px; color: #94a3b8; }

    /* ── Layout ── */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 36px 16px 60px; }

    /* ── Steps ── */
    .steps { display: flex; align-items: center; margin-bottom: 36px; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .step { display: flex; align-items: center; gap: 8px; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid #2d3446; color: #475569; transition: all .3s; }
    .step-num.active { border-color: #6366f1; color: #6366f1; background: rgba(99,102,241,.12); }
    .step-num.done { border-color: #10b981; color: #10b981; background: rgba(16,185,129,.12); }
    .step-label { font-size: 13px; color: #475569; font-weight: 500; }
    .step-label.active { color: #e2e8f0; }
    .step-divider { width: 28px; height: 1px; background: #1e2330; margin: 0 4px; }

    /* ── Cards ── */
    .card { width: 100%; max-width: 640px; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 36px; margin-bottom: 20px; }
    .card-wide { max-width: 980px; }
    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { color: #64748b; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }

    /* ── Form Fields ── */
    .field { margin-bottom: 18px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .field-label { display: block; font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
    .field-input { width: 100%; padding: 10px 14px; background: #0d0f14; border: 1px solid #1e2330; border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none; transition: border-color .2s; }
    .field-input:focus { border-color: #6366f1; }
    .field-input::placeholder { color: #2d3446; }

    /* ── Dropzone ── */
    .dropzone { border: 2px dashed #1e2330; border-radius: 12px; padding: 40px 32px; text-align: center; cursor: pointer; transition: all .2s; }
    .dropzone:hover, .dropzone.dragover { border-color: #6366f1; background: rgba(99,102,241,.04); }
    .dropzone.has-file { border-color: #10b981; background: rgba(16,185,129,.04); }
    .dz-icon { font-size: 36px; margin-bottom: 12px; }
    .dz-text { font-size: 14px; color: #64748b; }
    .dz-text strong { color: #a855f7; }
    .dz-file-name { font-size: 14px; font-weight: 600; color: #10b981; margin-top: 6px; }
    .dz-hint { font-size: 12px; color: #475569; margin-top: 5px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 0 20px rgba(99,102,241,.3); width: 100%; justify-content: center; margin-top: 20px; font-size: 15px; padding: 14px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(99,102,241,.45); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost { background: #1e2330; color: #94a3b8; border: 1px solid #2d3446; }
    .btn-ghost:hover { background: #252b3b; color: #e2e8f0; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 0 16px rgba(239,68,68,.25); }
    .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(239,68,68,.4); }
    .btn-auto { width: auto; margin-top: 0; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 0 16px rgba(16,185,129,.25); }
    .btn-green:hover { transform: translateY(-1px); }

    /* ── Loading ── */
    .loading-card { width: 100%; max-width: 480px; text-align: center; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 52px 36px; }
    .spinner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #1e2330; border-top-color: #6366f1; animation: spin 1s linear infinite; margin: 0 auto 28px; }
    .spinner-purple { border-top-color: #a855f7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .loading-sub { color: #475569; font-size: 14px; line-height: 1.7; }
    .loading-steps { margin-top: 28px; text-align: left; }
    .loading-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; color: #475569; }
    .loading-step.done { color: #10b981; }
    .loading-step.active { color: #a855f7; }
    .ls-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .ls-dot.pulse { animation: blink .8s ease-in-out infinite alternate; }
    @keyframes blink { from { opacity: .3; } to { opacity: 1; } }

    /* ── Question Bank ── */
    .qb-header { margin-bottom: 24px; }
    .qb-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .qb-meta { font-size: 13px; color: #64748b; }
    .qb-meta span { color: #94a3b8; font-weight: 600; }
    .summary-box { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
    .summary-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 6px; }
    .summary-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .risk-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #fbbf24; margin-bottom: 10px; }
    .risk-flags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .risk-flag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.25); color: #fbbf24; }
    .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .cat-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #1e2330; background: #0d0f14; color: #475569; transition: all .15s; }
    .cat-tab.t-all.on    { color: #e2e8f0; background: #1e2330; border-color: #2d3446; }
    .cat-tab.t-technical.on { color: #38bdf8; background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); }
    .cat-tab.t-behavioral.on { color: #34d399; background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); }
    .cat-tab.t-trap.on   { color: #f87171; background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); }
    .cat-tab.t-pressure.on { color: #fb923c; background: rgba(251,146,60,.1); border-color: rgba(251,146,60,.3); }
    .q-list { display: flex; flex-direction: column; gap: 12px; }
    .q-card { background: #0d0f14; border: 1px solid #1e2330; border-radius: 12px; padding: 18px; transition: border-color .2s; }
    .q-card:hover { border-color: #2d3446; }
    .q-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .q-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .qb { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px; border-radius: 4px; }
    .qb-technical  { background: rgba(56,189,248,.12); color: #38bdf8; border: 1px solid rgba(56,189,248,.25); }
    .qb-behavioral { background: rgba(52,211,153,.12); color: #34d399; border: 1px solid rgba(52,211,153,.25); }
    .qb-trap       { background: rgba(248,113,113,.12); color: #f87171; border: 1px solid rgba(248,113,113,.25); }
    .qb-pressure   { background: rgba(251,146,60,.12); color: #fb923c; border: 1px solid rgba(251,146,60,.25); }
    .qb-easy       { background: rgba(52,211,153,.08); color: #6ee7b7; border: 1px solid rgba(52,211,153,.15); }
    .qb-medium     { background: rgba(250,204,21,.08); color: #fcd34d; border: 1px solid rgba(250,204,21,.15); }
    .qb-hard       { background: rgba(248,113,113,.08); color: #fca5a5; border: 1px solid rgba(248,113,113,.15); }
    .qb-traptype   { background: rgba(168,85,247,.1); color: #c084fc; border: 1px solid rgba(168,85,247,.25); }
    .q-num { font-size: 11px; color: #2d3446; font-weight: 700; white-space: nowrap; }
    .q-text { font-size: 14px; font-weight: 600; color: #e2e8f0; line-height: 1.6; margin-bottom: 10px; }
    .q-actions { display: flex; align-items: center; gap: 6px; }
    .q-copy-btn, .q-expand-btn { padding: 4px 9px; font-size: 11px; border-radius: 5px; background: #1e2330; border: 1px solid #2d3446; color: #64748b; cursor: pointer; transition: all .15s; }
    .q-copy-btn:hover, .q-expand-btn:hover { color: #e2e8f0; }
    .q-copy-btn.copied { color: #10b981; }
    .q-notes { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .q-note { display: grid; grid-template-columns: 100px 1fr; gap: 8px; }
    .q-note-lbl { font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #475569; padding-top: 2px; }
    .q-note-val { font-size: 12px; color: #64748b; line-height: 1.5; }
    .q-note-val.danger { color: #f87171; }
    .q-note-val.follow { color: #a855f7; font-style: italic; }
    .tips-box { margin-top: 24px; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.2); border-radius: 10px; padding: 16px 20px; }
    .tips-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 6px; }
    .tips-txt { font-size: 13px; color: #94a3b8; line-height: 1.7; }
    .export-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #1e2330; }
    .export-info { font-size: 13px; color: #475569; }
    .export-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 8px; padding: 12px 16px; margin-top: 14px; font-size: 13px; color: #fca5a5; line-height: 1.6; }

    /* ── Interview Screen ── */
    .iv-wrap { width: 100%; max-width: 1220px; display: flex; flex-direction: column; gap: 14px; }

    /* Status bar */
    .iv-statusbar { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .iv-status-left { display: flex; align-items: center; gap: 20px; }
    .rec-badge { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #ef4444; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink .9s ease-in-out infinite alternate; }
    .iv-timer { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; }
    .iv-timer.idle { color: #2d3446; }
    .iv-meta { font-size: 13px; color: #64748b; }
    .iv-meta strong { color: #94a3b8; }
    .iv-status-right { display: flex; align-items: center; gap: 10px; }
    .tab-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .tab-pill.ok   { color: #10b981; background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.2); }
    .tab-pill.warn { color: #fbbf24; background: rgba(234,179,8,.08); border: 1px solid rgba(234,179,8,.25); }
    .priv-note { font-size: 11px; color: #2d3446; background: #0d0f14; border: 1px solid #1e2330; padding: 3px 9px; border-radius: 20px; }

    /* Setup panel */
    .iv-setup-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 28px 32px; }
    .iv-setup-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .iv-setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .iv-setup-grid { grid-template-columns: 1fr; } }
    .setup-block { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; padding: 20px; }
    .setup-block-title { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #6366f1; margin-bottom: 14px; }
    .room-link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .room-link-text { flex: 1; padding: 9px 12px; background: #12151d; border: 1px solid #1e2330; border-radius: 7px; font-size: 12px; color: #94a3b8; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .consent-text { font-size: 13px; color: #94a3b8; line-height: 1.7; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.15); border-radius: 8px; padding: 12px 14px; font-style: italic; }
    .setup-checklist { display: flex; flex-direction: column; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #64748b; }
    .check-box { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #2d3446; background: #0d0f14; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; transition: all .15s; }
    .check-box.checked { background: #10b981; border-color: #10b981; color: white; }
    .setup-footer { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .audio-note { font-size: 12px; color: #475569; }
    .audio-note strong { color: #fbbf24; }

    /* Interview body */
    .iv-body { display: grid; grid-template-columns: 1fr 340px; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .iv-body { grid-template-columns: 1fr; } }

    /* Video + transcript column */
    .iv-left { display: flex; flex-direction: column; gap: 14px; }
    .video-card { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .video-label { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; padding: 12px 18px 0; }
    .jitsi-frame { width: 100%; height: 360px; border: none; display: block; }
    .transcript-card { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 20px; }
    .transcript-label { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .rec-live { font-size: 11px; color: #ef4444; display: flex; align-items: center; gap: 5px; }
    .rec-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; animation: blink .9s ease-in-out infinite alternate; }
    .transcript-body { min-height: 140px; max-height: 200px; overflow-y: auto; font-size: 14px; line-height: 1.85; color: #e2e8f0; }
    .transcript-final { color: #e2e8f0; }
    .transcript-interim { color: #475569; font-style: italic; }
    .transcript-empty { color: #2d3446; font-style: italic; font-size: 13px; }
    .word-count { font-size: 11px; color: #2d3446; margin-top: 8px; text-align: right; }

    /* Right panel */
    .iv-right { display: flex; flex-direction: column; gap: 14px; }
    .questions-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .panel-header { padding: 14px 16px; border-bottom: 1px solid #1e2330; }
    .panel-title { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; margin-bottom: 2px; }
    .panel-hint { font-size: 11px; color: #2d3446; }
    .questions-scroll { max-height: 320px; overflow-y: auto; }
    .q-sugg { padding: 12px 14px; border-bottom: 1px solid #1e2330; cursor: pointer; transition: background .15s; }
    .q-sugg:last-child { border-bottom: none; }
    .q-sugg:hover { background: #0d0f14; }
    .q-sugg.asked { opacity: .4; }
    .q-sugg.is-trap { border-left: 3px solid rgba(248,113,113,.5); }
    .q-sugg.is-dynamic-trap { border-left: 3px solid #f59e0b; background: rgba(245,158,11,.06); animation: trapPulse 1.5s ease-out 2; }
    @keyframes trapPulse { 0%,100% { background: rgba(245,158,11,.06); } 50% { background: rgba(245,158,11,.15); } }
    .q-sugg-text { font-size: 13px; color: #e2e8f0; line-height: 1.45; margin-bottom: 7px; }
    .q-sugg-text.crossed { text-decoration: line-through; color: #475569; }
    .q-sugg-foot { display: flex; align-items: center; justify-content: space-between; }
    .q-asked-mark { font-size: 10px; color: #10b981; font-weight: 700; }

    /* Dynamic Trap Banner */
    .trap-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; animation: trapBannerIn .4s ease-out; }
    @keyframes trapBannerIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: none; } }
    .trap-banner-left { display: flex; align-items: center; gap: 8px; }
    .trap-banner-icon { font-size: 18px; }
    .trap-banner-text { font-size: 12px; font-weight: 700; color: #f59e0b; }
    .trap-banner-sub { font-size: 11px; color: #92400e; margin-top: 1px; }
    .trap-banner-close { font-size: 16px; color: #78350f; cursor: pointer; padding: 2px 6px; border-radius: 4px; background: none; border: none; transition: color .2s; }
    .trap-banner-close:hover { color: #f59e0b; }

    /* Trap deployed badge in questions header */
    .trap-deployed-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #f59e0b; background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.3); padding: 2px 8px; border-radius: 12px; margin-left: 6px; animation: badgePop .3s ease-out; }
    @keyframes badgePop { from { transform: scale(0.7); opacity:0; } to { transform: scale(1); opacity:1; } }

    /* Trap generating spinner in questions sidebar */
    .trap-generating { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 12px; color: #f59e0b; border-bottom: 1px solid rgba(245,158,11,.2); background: rgba(245,158,11,.05); }
    .trap-spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(245,158,11,.3); border-top-color: #f59e0b; animation: spin .7s linear infinite; flex-shrink: 0; }

    /* Dynamic trap target hint */
    .q-trap-target { font-size: 10px; color: #78350f; margin-top: 4px; line-height: 1.4; }

    /* Notes panel */
    .notes-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .notes-textarea { width: 100%; min-height: 130px; background: #0d0f14; border: none; border-top: 1px solid #1e2330; padding: 14px 16px; color: #94a3b8; font-size: 13px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit; }
    .notes-textarea::placeholder { color: #2d3446; }

    /* Bottom bar */
    .iv-bottombar { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .iv-bottom-hint { font-size: 12px; color: #475569; }
    .iv-bottom-right { display: flex; gap: 8px; align-items: center; }

    /* Speaker toggle */
    .speaker-toggle { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .spk-lbl { font-size: 10px; font-weight: 700; letter-spacing: .6px; color: #475569; }

    /* Locked decision block — shown at top of report */

    /* ── Integrity Report ── */
    .report-wrap { width: 100%; max-width: 880px; }

    .score-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
    .fill-green  { background: linear-gradient(90deg, #059669, #10b981); }

    /* Report sections */

    .quote-note { font-size: 12px; color: #f87171; }

    .notes-in-report { background: #12151d; border: 1px solid #1e2330; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
    .notes-content { font-size: 13px; color: #94a3b8; line-height: 1.75; white-space: pre-wrap; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Constants ─────────────────────────────────────────────────────────────────
const TRAP_LABELS = {
  fake_tool: '🎣 Fake Tool', contradiction: '🔀 Contradiction',
  simplicity: '🧠 Simplicity', specificity: '🔍 Specificity', achievement_depth: '📊 Achievement Depth',
};

// ── Helpers ───────────────────────────────────────────────────────────────────
async function parsePDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(x => x.str).join(' ') + '\n\n';
  }
  const extracted = text.trim();

  // ── Resume validation ──────────────────────────────────────────────────────
  if (extracted.length < 80) {
    throw new Error(
      'This PDF appears to be empty or image-only (no readable text was found). ' +
      'Please upload a text-based resume PDF. If your resume is scanned, convert it to text first.'
    );
  }

  const lower = extracted.toLowerCase();
  const resumeSignals = [
    'experience','education','skill','work','job','university','college',
    'degree','company','project','employment','career','qualification',
    'certif','linkedin','github','email','phone','summary','objective',
    'intern','engineer','developer','manager','analyst','designer',
    'bachelor','master','diploma','award','achievement','responsibility',
    'team','built','developed','managed','led','implemented','proficient'
  ];
  const hits = resumeSignals.filter(w => lower.includes(w)).length;

  if (hits < 3) {
    throw new Error(
      "This file doesn't look like a resume or CV (too few professional keywords found). " +
      "Please upload the candidate's actual resume PDF."
    );
  }

  return extracted;
}

async function generateQuestions(resumeText, role, company) {
  const contextPrefix = (role || company)
    ? `[INTERVIEW CONTEXT — Role: ${role || 'Not specified'} | Company: ${company || 'Not specified'}]\n\n`
    : '';
  const res = await fetch('/api/generate-questions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resume_text: contextPrefix + resumeText }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Error ${res.status}`); }
  return res.json();
}

async function scoreInterview(payload) {
  const res = await fetch('/api/score-interview', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Error ${res.status}`); }
  return res.json();
}

async function scoreTurn(answerText, turnNumber, latencyMs, longestSilenceMs) {
  try {
    const res = await fetch('/api/score-turn', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        answer_text: answerText,
        turn_number: turnNumber,
        latency_ms: latencyMs != null ? Math.round(latencyMs) : null,
        longest_silence_ms: longestSilenceMs != null ? Math.round(longestSilenceMs) : null,
      }),
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

async function generateTrap(lastAnswers, role, resumeSnippet, suspicionNotes) {
  try {
    const res = await fetch('/api/generate-trap', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        last_answers: lastAnswers,
        role: role,
        resume_snippet: resumeSnippet,
        suspicion_notes: suspicionNotes,
      }),
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

function formatTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

function genSessionId() {
  return 'IAI-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
}

function genRoomId(name) {
  return 'IntegrityAI-' + (name||'Interview').replace(/[^a-zA-Z0-9]/g,'').toLowerCase() + '-' + Date.now().toString(36);
}

function scoreColor(s) { return s >= 70 ? 'score-green' : s >= 40 ? 'score-yellow' : 'score-red'; }
function fillClass(s)  { return s >= 70 ? 'fill-green'  : s >= 40 ? 'fill-yellow'  : 'fill-red'; }
function recClass(r)   { return r === 'proceed' ? 'rec-proceed' : r === 're-interview' ? 'rec-reinterview' : 'rec-donot'; }
function recLabel(r)   {
  return r === 'proceed' ? '✅ Proceed to Next Round'
       : r === 're-interview' ? '⚠️ Re-interview Recommended'
       : '🚫 Do Not Proceed';
}

// ── Components ────────────────────────────────────────────────────────────────
function Topbar({ step }) {
  const labels = { 1:'UPLOAD & SETUP', 2:'GENERATING QUESTIONS', 3:'QUESTION BANK', 4:'LIVE INTERVIEW', 5:'INTEGRITY REPORT' };
  return (
    <div className="topbar">
      <div className="logo">
        <div className="logo-icon">🛡</div>
        <div className="logo-text">Integrity<span>AI</span></div>
      </div>
      <div className="badge">{labels[step]||'INTEGRITY AI'}</div>
    </div>
  );
}

function Steps({ current }) {
  const list = [{n:1,l:'Setup'},{n:2,l:'Analyse'},{n:3,l:'Questions'},{n:4,l:'Interview'},{n:5,l:'Report'}];
  return (
    <div className="steps">
      {list.map((s,i) => (
        <React.Fragment key={s.n}>
          {i > 0 && <div className="step-divider" />}
          <div className="step">
            <div className={`step-num ${current===s.n?'active':current>s.n?'done':''}`}>{current>s.n?'✓':s.n}</div>
            <div className={`step-label ${current===s.n?'active':''}`}>{s.l}</div>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

// ── Step 1: Upload + Role/Company ─────────────────────────────────────────────
function DropZone({ file, onFile }) {
  const [drag, setDrag] = useState(false); const ref = useRef();
  const onDrop = useCallback(e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f?.type==='application/pdf') onFile(f); }, [onFile]);
  return (
    <div className={`dropzone ${drag?'dragover':''} ${file?'has-file':''}`}
      onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
      onDrop={onDrop} onClick={()=>ref.current.click()}>
      <input ref={ref} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])onFile(e.target.files[0]);}} />

             : (<><div className="dz-text"><strong>Click to upload</strong> or drag & drop resume here</div><div className="dz-hint">PDF only · Parsed in browser · Never stored</div></>)}

  );
}
