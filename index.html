<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntegrityAI — Interview Authenticity Detector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0f14; color: #e2e8f0; min-height: 100vh; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #12151d; border-bottom: 1px solid #1e2330; position: sticky; top: 0; z-index: 10; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-size: 18px; font-weight: 700; }
    .logo-text span { color: #a855f7; }
    .badge { font-size: 11px; font-weight: 600; letter-spacing: .5px; background: #1e2330; border: 1px solid #2d3446; padding: 3px 10px; border-radius: 20px; color: #94a3b8; }

    /* ── Layout ── */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 60px; }

    /* ── Steps ── */
    .steps { display: flex; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .step { display: flex; align-items: center; gap: 8px; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid #2d3446; color: #475569; transition: all .3s; }
    .step-num.active { border-color: #6366f1; color: #6366f1; background: rgba(99,102,241,.12); }
    .step-num.done { border-color: #10b981; color: #10b981; background: rgba(16,185,129,.12); }
    .step-label { font-size: 13px; color: #475569; font-weight: 500; }
    .step-label.active { color: #e2e8f0; }
    .step-divider { width: 28px; height: 1px; background: #1e2330; margin: 0 4px; }

    /* ── Cards ── */
    .card { width: 100%; max-width: 620px; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 36px; margin-bottom: 20px; }
    .card-wide { max-width: 960px; }
    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { color: #64748b; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }

    /* ── Dropzone ── */
    .dropzone { border: 2px dashed #1e2330; border-radius: 12px; padding: 48px 32px; text-align: center; cursor: pointer; transition: all .2s; }
    .dropzone:hover, .dropzone.dragover { border-color: #6366f1; background: rgba(99,102,241,.04); }
    .dropzone.has-file { border-color: #10b981; background: rgba(16,185,129,.04); }
    .dz-icon { font-size: 40px; margin-bottom: 14px; }
    .dz-text { font-size: 14px; color: #64748b; }
    .dz-text strong { color: #a855f7; }
    .dz-file-name { font-size: 15px; font-weight: 600; color: #10b981; margin-top: 8px; }
    .dz-hint { font-size: 12px; color: #475569; margin-top: 6px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 0 20px rgba(99,102,241,.3); width: 100%; justify-content: center; margin-top: 24px; font-size: 15px; padding: 14px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(99,102,241,.45); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost { background: #1e2330; color: #94a3b8; border: 1px solid #2d3446; }
    .btn-ghost:hover { background: #252b3b; color: #e2e8f0; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 0 20px rgba(239,68,68,.25); }
    .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(239,68,68,.4); }
    .btn-auto { width: auto; margin-top: 0; }

    /* ── Loading ── */
    .loading-card { width: 100%; max-width: 480px; text-align: center; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 52px 36px; }
    .spinner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #1e2330; border-top-color: #6366f1; animation: spin 1s linear infinite; margin: 0 auto 28px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .loading-sub { color: #475569; font-size: 14px; line-height: 1.7; }
    .loading-steps { margin-top: 28px; text-align: left; }
    .loading-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; color: #475569; }
    .loading-step.done { color: #10b981; }
    .loading-step.active { color: #a855f7; }
    .ls-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .ls-dot.pulse { animation: blink .8s ease-in-out infinite alternate; }
    @keyframes blink { from { opacity: .3; } to { opacity: 1; } }

    /* ── Question Bank ── */
    .qb-header { margin-bottom: 28px; }
    .qb-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .qb-meta { font-size: 13px; color: #64748b; }
    .qb-meta span { color: #94a3b8; font-weight: 600; }
    .summary-box { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
    .summary-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 6px; }
    .summary-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .risk-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #fbbf24; margin-bottom: 10px; }
    .risk-flags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .risk-flag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.25); color: #fbbf24; }
    .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .cat-tab { padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #1e2330; background: #0d0f14; color: #475569; transition: all .15s; }
    .cat-tab.t-all.on    { color: #e2e8f0; background: #1e2330; border-color: #2d3446; }
    .cat-tab.t-technical.on { color: #38bdf8; background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); }
    .cat-tab.t-behavioral.on { color: #34d399; background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); }
    .cat-tab.t-trap.on   { color: #f87171; background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); }
    .cat-tab.t-pressure.on { color: #fb923c; background: rgba(251,146,60,.1); border-color: rgba(251,146,60,.3); }
    .q-list { display: flex; flex-direction: column; gap: 14px; }
    .q-card { background: #0d0f14; border: 1px solid #1e2330; border-radius: 12px; padding: 20px; transition: border-color .2s; }
    .q-card:hover { border-color: #2d3446; }
    .q-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .q-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .qb { font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 3px 9px; border-radius: 4px; }
    .qb-technical  { background: rgba(56,189,248,.12); color: #38bdf8; border: 1px solid rgba(56,189,248,.25); }
    .qb-behavioral { background: rgba(52,211,153,.12); color: #34d399; border: 1px solid rgba(52,211,153,.25); }
    .qb-trap       { background: rgba(248,113,113,.12); color: #f87171; border: 1px solid rgba(248,113,113,.25); }
    .qb-pressure   { background: rgba(251,146,60,.12); color: #fb923c; border: 1px solid rgba(251,146,60,.25); }
    .qb-easy       { background: rgba(52,211,153,.08); color: #6ee7b7; border: 1px solid rgba(52,211,153,.15); }
    .qb-medium     { background: rgba(250,204,21,.08); color: #fcd34d; border: 1px solid rgba(250,204,21,.15); }
    .qb-hard       { background: rgba(248,113,113,.08); color: #fca5a5; border: 1px solid rgba(248,113,113,.15); }
    .qb-traptype   { background: rgba(168,85,247,.1); color: #c084fc; border: 1px solid rgba(168,85,247,.25); }
    .q-num { font-size: 12px; color: #2d3446; font-weight: 700; white-space: nowrap; margin-top: 2px; }
    .q-text { font-size: 15px; font-weight: 600; color: #e2e8f0; line-height: 1.6; margin-bottom: 12px; }
    .q-actions { display: flex; align-items: center; gap: 8px; }
    .q-copy-btn, .q-expand-btn { padding: 5px 10px; font-size: 12px; border-radius: 6px; background: #1e2330; border: 1px solid #2d3446; color: #64748b; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .q-copy-btn:hover, .q-expand-btn:hover { color: #e2e8f0; border-color: #475569; }
    .q-copy-btn.copied { color: #10b981; border-color: rgba(16,185,129,.4); }
    .q-notes { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .q-note { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
    .q-note-lbl { font-size: 11px; font-weight: 700; letter-spacing: .5px; color: #475569; padding-top: 2px; }
    .q-note-val { font-size: 13px; color: #64748b; line-height: 1.5; }
    .q-note-val.danger { color: #f87171; }
    .q-note-val.follow { color: #a855f7; font-style: italic; }
    .tips-box { margin-top: 28px; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.2); border-radius: 10px; padding: 16px 20px; }
    .tips-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 8px; }
    .tips-txt { font-size: 13px; color: #94a3b8; line-height: 1.7; }
    .export-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 28px; padding-top: 24px; border-top: 1px solid #1e2330; }
    .export-info { font-size: 13px; color: #475569; }
    .export-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 8px; padding: 14px 18px; margin-top: 16px; font-size: 13px; color: #fca5a5; line-height: 1.6; }

    /* ── Interview Screen ── */
    .iv-wrap { width: 100%; max-width: 1140px; display: flex; flex-direction: column; gap: 16px; }

    .iv-topbar { background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .iv-topbar-left { display: flex; align-items: center; gap: 20px; }
    .rec-badge { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #ef4444; }
    .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink .9s ease-in-out infinite alternate; flex-shrink: 0; }
    .iv-timer { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; letter-spacing: .5px; }
    .iv-timer.idle { color: #475569; }
    .iv-candidate-tag { font-size: 13px; color: #64748b; }
    .iv-candidate-tag strong { color: #94a3b8; }
    .iv-topbar-right { display: flex; align-items: center; gap: 10px; }
    .tab-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
    .tab-badge.ok   { color: #10b981; background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.2); }
    .tab-badge.warn { color: #fbbf24; background: rgba(234,179,8,.08); border: 1px solid rgba(234,179,8,.25); }
    .interviewer-note { font-size: 11px; color: #2d3446; background: #0d0f14; border: 1px solid #1e2330; padding: 3px 10px; border-radius: 20px; }

    .iv-body { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .iv-body { grid-template-columns: 1fr; } }

    .transcript-card { background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; }
    .transcript-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #94a3b8; margin-bottom: 14px; }
    .transcript-body { min-height: 340px; max-height: 460px; overflow-y: auto; font-size: 15px; line-height: 1.85; color: #e2e8f0; }
    .transcript-final { color: #e2e8f0; }
    .transcript-interim { color: #475569; font-style: italic; }
    .transcript-placeholder { color: #2d3446; font-style: italic; font-size: 14px; }
    .transcript-wordcount { font-size: 11px; color: #2d3446; margin-top: 12px; text-align: right; }

    .questions-sidebar { display: flex; flex-direction: column; gap: 0; }
    .sidebar-header { background: #12151d; border: 1px solid #1e2330; border-radius: 16px 16px 0 0; padding: 16px 20px; border-bottom: none; }
    .sidebar-title { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #94a3b8; margin-bottom: 4px; }
    .sidebar-hint { font-size: 11px; color: #2d3446; }
    .questions-list { background: #0d0f14; border: 1px solid #1e2330; border-top: none; border-radius: 0 0 16px 16px; max-height: 480px; overflow-y: auto; }
    .q-sugg { padding: 12px 16px; border-bottom: 1px solid #1e2330; cursor: pointer; transition: background .15s; }
    .q-sugg:last-child { border-bottom: none; }
    .q-sugg:hover { background: #12151d; }
    .q-sugg.asked { opacity: .45; }
    .q-sugg.is-trap { border-left: 3px solid rgba(248,113,113,.4); }
    .q-sugg-text { font-size: 13px; color: #e2e8f0; line-height: 1.5; margin-bottom: 8px; }
    .q-sugg-text.done { text-decoration: line-through; color: #475569; }
    .q-sugg-footer { display: flex; align-items: center; justify-content: space-between; }
    .q-sugg-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .q-asked-check { font-size: 11px; color: #10b981; font-weight: 600; }

    .iv-bottombar { background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .iv-bottom-left { display: flex; align-items: center; gap: 12px; }
    .iv-bottom-hint { font-size: 12px; color: #475569; }
    .iv-bottom-right { display: flex; gap: 10px; align-items: center; }

    /* ── Analysing overlay ── */
    .analysing-card { width: 100%; max-width: 480px; text-align: center; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 52px 36px; }
    .analysing-spinner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #1e2330; border-top-color: #a855f7; animation: spin 1s linear infinite; margin: 0 auto 28px; }

    /* ── Integrity Report ── */
    .report-wrap { width: 100%; max-width: 860px; }
    .report-toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
    .report-heading { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .report-sub { font-size: 13px; color: #64748b; }

    .verdict-card { background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 28px 32px; margin-bottom: 20px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
    .score-left { }
    .score-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #94a3b8; margin-bottom: 6px; }
    .score-number { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 10px; }
    .score-green  { color: #10b981; }
    .score-yellow { color: #fbbf24; }
    .score-red    { color: #ef4444; }
    .score-track { width: 240px; height: 8px; background: #1e2330; border-radius: 4px; }
    .score-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }
    .fill-green  { background: linear-gradient(90deg, #059669, #10b981); }
    .fill-yellow { background: linear-gradient(90deg, #d97706, #fbbf24); }
    .fill-red    { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .verdict-right { flex: 1; }
    .rec-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 8px 18px; border-radius: 8px; letter-spacing: .3px; margin-bottom: 14px; }
    .rec-proceed    { background: rgba(16,185,129,.12); color: #10b981; border: 1px solid rgba(16,185,129,.3); }
    .rec-reinterview{ background: rgba(251,191,36,.1);  color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
    .rec-donot      { background: rgba(239,68,68,.1);   color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .rec-reason { font-size: 14px; color: #94a3b8; line-height: 1.7; }

    .section-hdr { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #94a3b8; margin-bottom: 14px; text-transform: uppercase; }
    .flags-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .flag-row { background: #12151d; border: 1px solid #1e2330; border-radius: 10px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; }
    .flag-sev { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; margin-top: 1px; letter-spacing: .4px; }
    .sev-high   { background: rgba(239,68,68,.1);   color: #f87171; border: 1px solid rgba(239,68,68,.2); }
    .sev-medium { background: rgba(251,191,36,.08); color: #fbbf24; border: 1px solid rgba(251,191,36,.2); }
    .sev-low    { background: rgba(100,116,139,.1); color: #94a3b8; border: 1px solid rgba(100,116,139,.2); }
    .flag-body { flex: 1; }
    .flag-detail { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .flag-type { font-size: 11px; color: #475569; margin-top: 5px; text-transform: uppercase; letter-spacing: .5px; }

    .assessment-box { background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.2); border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; }
    .assessment-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 10px; }
    .assessment-text { font-size: 14px; color: #94a3b8; line-height: 1.75; }

    .quotes-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .quote-item { background: #12151d; border-left: 3px solid #ef4444; border-radius: 0 10px 10px 0; padding: 14px 18px; }
    .quote-text { font-size: 14px; color: #e2e8f0; font-style: italic; line-height: 1.5; margin-bottom: 6px; }
    .quote-note { font-size: 12px; color: #f87171; }

    .transcript-collapsed { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; }
    .transcript-toggle { width: 100%; padding: 14px 18px; background: none; border: none; color: #64748b; font-size: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; }
    .transcript-toggle:hover { color: #94a3b8; }
    .transcript-full-body { padding: 0 18px 18px; font-size: 13px; color: #64748b; line-height: 1.85; max-height: 320px; overflow-y: auto; }

    .report-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; flex-wrap: wrap; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0d0f14; }
    ::-webkit-scrollbar-thumb { background: #1e2330; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Helpers ───────────────────────────────────────────────────────────────────
async function parsePDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(x => x.str).join(' ') + '\n\n';
  }
  return text.trim();
}

async function generateQuestions(resumeText) {
  const res = await fetch('/api/generate-questions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resume_text: resumeText }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Server error ${res.status}`); }
  return res.json();
}

async function scoreInterview(payload) {
  const res = await fetch('/api/score-interview', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Scoring error ${res.status}`); }
  return res.json();
}

function formatTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

const TRAP_LABELS = { fake_tool:'🎣 Fake Tool', contradiction:'🔀 Contradiction', simplicity:'🧠 Simplicity', specificity:'🔍 Specificity', achievement_depth:'📊 Achievement Depth' };

function scoreColor(s) { return s >= 70 ? 'score-green' : s >= 40 ? 'score-yellow' : 'score-red'; }
function fillClass(s)  { return s >= 70 ? 'fill-green'  : s >= 40 ? 'fill-yellow'  : 'fill-red'; }
function recClass(r)   { return r === 'proceed' ? 'rec-proceed' : r === 're-interview' ? 'rec-reinterview' : 'rec-donot'; }
function recLabel(r)   { return r === 'proceed' ? '✅ Proceed to Next Round' : r === 're-interview' ? '⚠️ Re-interview Recommended' : '🚫 Do Not Proceed'; }
function sevClass(s)   { return `sev-${s}`; }

  const [drag, setDrag] = useState(false); const ref = useRef();

  return (
    <div className={`dropzone ${drag?'dragover':''} ${file?'has-file':''}`} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop} onClick={()=>ref.current.click()}>
      <input ref={ref} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])onFile(e.target.files[0]);}} />
      <div className="dz-icon">{file?'✅':'📄'}</div>
      {file ? (<><div className="dz-file-name">{file.name}</div><div className="dz-hint">Click to change</div></>) : (<><div className="dz-text"><strong>Click to upload</strong> or drag & drop resume here</div><div className="dz-hint">PDF only · Parsed in your browser · Never stored</div></>)}

// ── Step 4: Live Interview Screen ─────────────────────────────────────────────
function InterviewScreen({ questions, candidateName, onEnd }) {
  const [isRecording, setIsRecording] = useState(false);
  const [elapsed, setElapsed]         = useState(0);
  const [displayText, setDisplayText] = useState('');
  const [interim, setInterim]         = useState('');
  const [tabSwitches, setTabSwitches] = useState(0);
  const [askedIds, setAskedIds]       = useState(new Set());
  const [isAnalysing, setIsAnalysing] = useState(false);
  const [analyseError, setAnalyseError] = useState('');

  const isRecordingRef  = useRef(false);
  const transcriptRef   = useRef('');
  const sessionFinalRef = useRef('');
  const timerRef        = useRef(null);
  const recRef          = useRef(null);

  // Tab switch detection
  useEffect(() => {
    const onHide = () => { if (document.hidden) setTabSwitches(n => n+1); };
    const onBlur = () => setTabSwitches(n => n+1);
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('blur', onBlur);
    return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('blur', onBlur); };
  }, []);

  const startSpeech = () => {
    if (!isRecordingRef.current) return;
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    sessionFinalRef.current = '';
    rec.onresult = (e) => {
      let finals = ''; let interimText = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finals += e.results[i][0].transcript + ' ';
        else interimText += e.results[i][0].transcript;
      }
      sessionFinalRef.current = finals;
      setInterim(interimText);
      setDisplayText(transcriptRef.current + finals);
    };
    rec.onend = () => {
      transcriptRef.current += sessionFinalRef.current;
      sessionFinalRef.current = '';
      setInterim('');
      setDisplayText(transcriptRef.current);
      if (isRecordingRef.current) setTimeout(startSpeech, 250);
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed') { alert('Microphone access denied. Please allow microphone access in Chrome and reload.'); stopRecording(); }
    };
    recRef.current = rec;
    rec.start();
  };

  const startRecording = () => {
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) { alert('Speech recognition requires Google Chrome. Please open this page in Chrome to use the recording feature.'); return; }
    isRecordingRef.current = true;
    setIsRecording(true);
    timerRef.current = setInterval(() => setElapsed(n => n+1), 1000);
    startSpeech();
  };

  const stopRecording = () => {
    isRecordingRef.current = false;
    setIsRecording(false);
    clearInterval(timerRef.current);
    recRef.current?.stop();
    transcriptRef.current += sessionFinalRef.current;
    sessionFinalRef.current = '';
    setInterim('');
    setDisplayText(transcriptRef.current);
  };

  const handleEndAndAnalyse = async () => {
    stopRecording();
    setIsAnalysing(true);
    setAnalyseError('');
    try {
      const trapQuestions = questions.filter(q => q.trap_type).map(q => q.question);
      const report = await scoreInterview({
        transcript: transcriptRef.current || '[No speech was recorded]',
        candidate_name: candidateName,
        trap_questions: trapQuestions,
        tab_switches: tabSwitches,
        duration_seconds: elapsed,
      });
      onEnd({ transcript: transcriptRef.current, tabSwitches, elapsed, report });
    } catch (err) {
      setAnalyseError(err.message);
      setIsAnalysing(false);
    }
  };

  const toggleAsked = (id) => {
    setAskedIds(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });
  };

  const wordCount = displayText.trim() ? displayText.trim().split(/\s+/).length : 0;

  if (isAnalysing) return (
    <div className="analysing-card">
      <div className="analysing-spinner" />
      <div className="loading-title">Analysing interview…</div>
      <div className="loading-sub" style={{marginTop:10}}>AI is reading the full transcript and checking for scripted language, vocabulary shifts, and trap question responses. This takes ~10 seconds.</div>
    </div>
  );

  return (
    <div className="iv-wrap">
      {/* Top bar */}
      <div className="iv-topbar">
        <div className="iv-topbar-left">
          {isRecording
            ? <div className="rec-badge"><div className="rec-dot" /> REC</div>
            : <div style={{fontSize:13, color:'#475569', fontWeight:600}}>⏸ PAUSED</div>}
          <div className={`iv-timer ${!isRecording&&elapsed===0?'idle':''}`}>{formatTime(elapsed)}</div>
          <div className="iv-candidate-tag">Candidate: <strong>{candidateName}</strong></div>
          <div className="interviewer-note">🔒 Interviewer view</div>
        </div>
        <div className="iv-topbar-right">
          <div className={`tab-badge ${tabSwitches===0?'ok':'warn'}`}>
            {tabSwitches===0 ? '✓ No tab switches' : `⚠ ${tabSwitches} tab switch${tabSwitches>1?'es':''}`}
          </div>
        </div>
      </div>

      {analyseError && <div className="error-box">⚠️ {analyseError} — try again or end without scoring.</div>}

      {/* Body: transcript + sidebar */}
      <div className="iv-body">
        {/* Transcript */}
        <div className="transcript-card">
          <div className="transcript-label">🎙 LIVE TRANSCRIPT — EVERYTHING BEING SAID IN THIS INTERVIEW</div>
          <div className="transcript-body">
            {(displayText || interim) ? (
              <><span className="transcript-final">{displayText}</span><span className="transcript-interim">{interim}</span></>
            ) : (
              <span className="transcript-placeholder">
                {isRecording
                  ? 'Listening… start speaking — everything said will appear here'
                  : 'Press Start Recording below, then conduct the interview naturally. The full conversation will be captured here.'}
              </span>
            )}
          </div>
          {wordCount > 0 && <div className="transcript-wordcount">{wordCount} words captured</div>}
        </div>

        {/* Questions sidebar */}
        <div className="questions-sidebar">
          <div className="sidebar-header">
            <div className="sidebar-title">💡 SUGGESTED QUESTIONS</div>
            <div className="sidebar-hint">Ask in your own words · Click to mark as covered</div>
          </div>
          <div className="questions-list">
            {questions.map((q) => (
              <div key={q.id||q.question} className={`q-sugg ${askedIds.has(q.id)?'asked':''} ${q.trap_type?'is-trap':''}`} onClick={()=>toggleAsked(q.id)}>
                <div className={`q-sugg-text ${askedIds.has(q.id)?'done':''}`}>{q.question}</div>
                <div className="q-sugg-footer">
                  <div className="q-sugg-badges">
                    <span className={`qb qb-${q.category}`} style={{fontSize:10}}>{q.category.toUpperCase()}</span>
                    {q.trap_type && <span className="qb qb-traptype" style={{fontSize:10}}>{TRAP_LABELS[q.trap_type]}</span>}
                  </div>
                  {askedIds.has(q.id) && <span className="q-asked-check">✓ Asked</span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Bottom bar */}
      <div className="iv-bottombar">
        <div className="iv-bottom-left">
          {!isRecording && elapsed===0 && <div className="iv-bottom-hint">Chrome required for recording · Mic permission will be requested</div>}
          {isRecording && <div className="iv-bottom-hint">🔴 Recording in progress — speak naturally, everything is being captured</div>}
          {!isRecording && elapsed>0 && <div className="iv-bottom-hint">Recording paused · {formatTime(elapsed)} captured</div>}
        </div>
        <div className="iv-bottom-right">
          {!isRecording
            ? <button className="btn btn-primary btn-auto" onClick={startRecording}>{elapsed===0?'🔴 Start Recording':'▶ Resume Recording'}</button>
            : <button className="btn btn-ghost" onClick={stopRecording}>⏸ Pause</button>}
          {elapsed > 0 && (
            <button className="btn btn-danger btn-auto" onClick={handleEndAndAnalyse}>
              ⏹ End &amp; Analyse Interview
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Step 5: Integrity Report ──────────────────────────────────────────────────
function IntegrityReport({ result, interviewData, onReset }) {
  const [showTranscript, setShowTranscript] = useState(false);
  const { transcript, tabSwitches, elapsed, report } = interviewData;

  if (!report) return (
    <div className="card" style={{maxWidth:640}}>
      <div className="card-title">Interview Complete</div>
      <div className="card-sub">AI scoring was unavailable. Here is the raw transcript.</div>
      <div className="transcript-full-body" style={{padding:0, maxHeight:'none', color:'#94a3b8', fontSize:14, lineHeight:1.8}}>{transcript || 'No transcript captured.'}</div>
      <button className="btn btn-ghost btn-sm" style={{marginTop:20}} onClick={onReset}>New Candidate</button>
    </div>
  );

  const s = report.integrity_score;

  return (
    <div className="report-wrap">
      <div className="report-toprow">
        <div>
          <div className="report-heading">Integrity Report</div>
          <div className="report-sub">
            Candidate: <strong style={{color:'#e2e8f0'}}>{result.candidate_name}</strong>
            &nbsp;·&nbsp; {formatTime(elapsed)} interview
            &nbsp;·&nbsp; {tabSwitches} tab switch{tabSwitches!==1?'es':''}
          </div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={onReset}>New Candidate</button>
      </div>

      {/* Verdict card */}
      <div className="verdict-card">
        <div className="score-left">
          <div className="score-lbl">INTEGRITY SCORE</div>
          <div className={`score-number ${scoreColor(s)}`}>{s}<span style={{fontSize:28, fontWeight:400}}>/100</span></div>
          <div className="score-track"><div className={`score-fill ${fillClass(s)}`} style={{width:`${s}%`}} /></div>
        </div>
        <div className="verdict-right">
          <div className={`rec-pill ${recClass(report.recommendation)}`}>{recLabel(report.recommendation)}</div>
          <div className="rec-reason">{report.recommendation_reason}</div>
        </div>
      </div>

      {/* Assessment */}
      {report.overall_assessment && (
        <div className="assessment-box">
          <div className="assessment-lbl">🧠 AI ASSESSMENT</div>
          <div className="assessment-text">{report.overall_assessment}</div>
        </div>
      )}

      {/* Flags */}
      {report.flags?.length > 0 && (
        <>
          <div className="section-hdr">⚑ Suspicion Flags ({report.flags.length})</div>
          <div className="flags-wrap">
            {report.flags.map((f, i) => (
              <div key={i} className="flag-row">
                <span className={`flag-sev ${sevClass(f.severity)}`}>{f.severity.toUpperCase()}</span>
                <div className="flag-body">
                  <div className="flag-detail">{f.detail}</div>
                  <div className="flag-type">{f.type?.replace(/_/g,' ')}</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Notable quotes */}
      {report.notable_quotes?.length > 0 && (
        <>
          <div className="section-hdr">💬 Suspicious Quotes from Transcript</div>
          <div className="quotes-wrap">
            {report.notable_quotes.map((q, i) => (
              <div key={i} className="quote-item">
                <div className="quote-text">"{q.quote}"</div>
                <div className="quote-note">⚠ {q.why_suspicious}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Full transcript (collapsible) */}
      {transcript && (
        <div className="transcript-collapsed">
          <button className="transcript-toggle" onClick={()=>setShowTranscript(!showTranscript)}>
            <span>📄 Full Interview Transcript</span>
            <span>{showTranscript?'▲ Hide':'▼ Show'}</span>
          </button>
          {showTranscript && <div className="transcript-full-body">{transcript}</div>}
        </div>
      )}

      <div className="report-actions">
        <button className="btn btn-ghost btn-sm" onClick={()=>downloadJSON({candidate:result.candidate_name, integrity_score:s, recommendation:report.recommendation, report, transcript}, `integrity-report-${(result.candidate_name||'candidate').toLowerCase().replace(/\s+/g,'-')}.json`)}>
          Export Full Report
        </button>
        <button className="btn btn-ghost btn-sm" onClick={onReset}>New Candidate</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [step, setStep]               = useState(1);
  const [loadingStep, setLoadingStep] = useState(0);
  const [result, setResult]           = useState(null);
  const [filename, setFilename]       = useState('');
  const [error, setError]             = useState('');
  const [interviewData, setInterviewData] = useState(null);

  const handleStart = async (file) => {
    setFilename(file.name); setError(''); setStep(2); setLoadingStep(0);
    try {
      const resumeText = await parsePDF(file); setLoadingStep(1);
      const data = await generateQuestions(resumeText); setLoadingStep(3);
      await new Promise(r => setTimeout(r, 500));
      setResult(data); setStep(3);
    } catch (err) { setError(err.message); setStep(1); }
  };

  const handleEndInterview = (data) => { setInterviewData(data); setStep(5); };
  const reset = () => { setStep(1); setResult(null); setError(''); setFilename(''); setInterviewData(null); };

  return (
    <div className="shell">
      <Topbar step={step} />
      <div className="main">
        <Steps current={step} />
        {step===1 && <Step1 onStart={handleStart} error={error} />}
        {step===2 && <Step2 loadingStep={loadingStep} />}
        {step===3 && result && <Step3 result={result} filename={filename} onReset={reset} onStartInterview={()=>setStep(4)} />}
        {step===4 && result && <InterviewScreen questions={result.questions} candidateName={result.candidate_name} onEnd={handleEndInterview} />}
        {step===5 && result && interviewData && <IntegrityReport result={result} interviewData={interviewData} onReset={reset} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
