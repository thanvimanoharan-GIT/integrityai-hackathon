<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntegrityAI — Interview Authenticity Detector</title>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <!-- Whereby video call — no external JS needed, pure iframe embed -->
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0f14; color: #e2e8f0; min-height: 100vh; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #12151d; border-bottom: 1px solid #1e2330; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 0 0 14px rgba(168,85,247,.45); }
    .logo { gap: 12px; }
    .logo-text { font-size: 18px; font-weight: 700; line-height: 1.1; }
    .logo-text span { color: #a855f7; }
    .logo-tagline { font-size: 10px; color: #475569; letter-spacing: .4px; font-weight: 500; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: .7px; background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.25); padding: 4px 12px; border-radius: 20px; color: #818cf8; }

    /* ── Layout ── */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 36px 16px 60px; }

    /* ── Steps ── */
    .steps { display: flex; align-items: center; margin-bottom: 36px; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .step { display: flex; align-items: center; gap: 8px; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid #2d3446; color: #475569; transition: all .3s; }
    .step-num.active { border-color: #6366f1; color: #6366f1; background: rgba(99,102,241,.12); }
    .step-num.done { border-color: #10b981; color: #10b981; background: rgba(16,185,129,.12); }
    .step-label { font-size: 13px; color: #475569; font-weight: 500; }
    .step-label.active { color: #e2e8f0; }
    .step-divider { width: 28px; height: 1px; background: #1e2330; margin: 0 4px; }

    /* ── Cards ── */
    .card { width: 100%; max-width: 640px; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 36px; margin-bottom: 20px; }
    .card-wide { max-width: 980px; }
    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { color: #64748b; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }

    /* ── Form Fields ── */
    .field { margin-bottom: 18px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .field-label { display: block; font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
    .field-input { width: 100%; padding: 10px 14px; background: #0d0f14; border: 1px solid #1e2330; border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none; transition: border-color .2s; }
    .field-input:focus { border-color: #6366f1; }
    .field-input::placeholder { color: #2d3446; }

    /* ── Dropzone ── */
    .dropzone { border: 2px dashed #1e2330; border-radius: 12px; padding: 40px 32px; text-align: center; cursor: pointer; transition: all .2s; }
    .dropzone:hover, .dropzone.dragover { border-color: #6366f1; background: rgba(99,102,241,.04); }
    .dropzone.has-file { border-color: #10b981; background: rgba(16,185,129,.04); }
    .dz-icon { font-size: 36px; margin-bottom: 12px; }
    .dz-text { font-size: 14px; color: #64748b; }
    .dz-text strong { color: #a855f7; }
    .dz-file-name { font-size: 14px; font-weight: 600; color: #10b981; margin-top: 6px; }
    .dz-hint { font-size: 12px; color: #475569; margin-top: 5px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 0 20px rgba(99,102,241,.3); width: 100%; justify-content: center; margin-top: 20px; font-size: 15px; padding: 14px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(99,102,241,.45); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost { background: #1e2330; color: #94a3b8; border: 1px solid #2d3446; }
    .btn-ghost:hover { background: #252b3b; color: #e2e8f0; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 0 16px rgba(239,68,68,.25); }
    .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(239,68,68,.4); }
    .btn-auto { width: auto; margin-top: 0; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 0 16px rgba(16,185,129,.25); }
    .btn-green:hover { transform: translateY(-1px); }

    /* ── Loading ── */
    .loading-card { width: 100%; max-width: 480px; text-align: center; background: #12151d; border: 1px solid #1e2330; border-radius: 16px; padding: 52px 36px; }
    .spinner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #1e2330; border-top-color: #6366f1; animation: spin 1s linear infinite; margin: 0 auto 28px; }
    .spinner-purple { border-top-color: #a855f7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .loading-sub { color: #475569; font-size: 14px; line-height: 1.7; }
    .loading-steps { margin-top: 28px; text-align: left; }
    .loading-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; color: #475569; }
    .loading-step.done { color: #10b981; }
    .loading-step.active { color: #a855f7; }
    .ls-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .ls-dot.pulse { animation: blink .8s ease-in-out infinite alternate; }
    @keyframes blink { from { opacity: .3; } to { opacity: 1; } }

    /* ── Question Bank ── */
    .qb-header { margin-bottom: 24px; }
    .qb-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .qb-meta { font-size: 13px; color: #64748b; }
    .qb-meta span { color: #94a3b8; font-weight: 600; }
    .summary-box { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
    .summary-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 6px; }
    .summary-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .risk-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #fbbf24; margin-bottom: 10px; }
    .risk-flags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .risk-flag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.25); color: #fbbf24; }
    .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .cat-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #1e2330; background: #0d0f14; color: #475569; transition: all .15s; }
    .cat-tab.t-all.on    { color: #e2e8f0; background: #1e2330; border-color: #2d3446; }
    .cat-tab.t-technical.on { color: #38bdf8; background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); }
    .cat-tab.t-behavioral.on { color: #34d399; background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); }
    .cat-tab.t-trap.on   { color: #f87171; background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); }
    .cat-tab.t-pressure.on { color: #fb923c; background: rgba(251,146,60,.1); border-color: rgba(251,146,60,.3); }
    .q-list { display: flex; flex-direction: column; gap: 12px; }
    .q-card { background: #0d0f14; border: 1px solid #1e2330; border-radius: 12px; padding: 18px; transition: border-color .2s; }
    .q-card:hover { border-color: #2d3446; }
    .q-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .q-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .qb { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px; border-radius: 4px; }
    .qb-technical  { background: rgba(56,189,248,.12); color: #38bdf8; border: 1px solid rgba(56,189,248,.25); }
    .qb-behavioral { background: rgba(52,211,153,.12); color: #34d399; border: 1px solid rgba(52,211,153,.25); }
    .qb-trap       { background: rgba(248,113,113,.12); color: #f87171; border: 1px solid rgba(248,113,113,.25); }
    .qb-pressure   { background: rgba(251,146,60,.12); color: #fb923c; border: 1px solid rgba(251,146,60,.25); }
    .qb-easy       { background: rgba(52,211,153,.08); color: #6ee7b7; border: 1px solid rgba(52,211,153,.15); }
    .qb-medium     { background: rgba(250,204,21,.08); color: #fcd34d; border: 1px solid rgba(250,204,21,.15); }
    .qb-hard       { background: rgba(248,113,113,.08); color: #fca5a5; border: 1px solid rgba(248,113,113,.15); }
    .qb-traptype   { background: rgba(168,85,247,.1); color: #c084fc; border: 1px solid rgba(168,85,247,.25); }
    .q-num { font-size: 11px; color: #2d3446; font-weight: 700; white-space: nowrap; }
    .q-text { font-size: 14px; font-weight: 600; color: #e2e8f0; line-height: 1.6; margin-bottom: 10px; }
    .q-actions { display: flex; align-items: center; gap: 6px; }
    .q-copy-btn, .q-expand-btn { padding: 4px 9px; font-size: 11px; border-radius: 5px; background: #1e2330; border: 1px solid #2d3446; color: #64748b; cursor: pointer; transition: all .15s; }
    .q-copy-btn:hover, .q-expand-btn:hover { color: #e2e8f0; }
    .q-copy-btn.copied { color: #10b981; }
    .q-notes { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .q-note { display: grid; grid-template-columns: 100px 1fr; gap: 8px; }
    .q-note-lbl { font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #475569; padding-top: 2px; }
    .q-note-val { font-size: 12px; color: #64748b; line-height: 1.5; }
    .q-note-val.danger { color: #f87171; }
    .q-note-val.follow { color: #a855f7; font-style: italic; }
    .tips-box { margin-top: 24px; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.2); border-radius: 10px; padding: 16px 20px; }
    .tips-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #6366f1; margin-bottom: 6px; }
    .tips-txt { font-size: 13px; color: #94a3b8; line-height: 1.7; }
    .export-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #1e2330; }
    .export-info { font-size: 13px; color: #475569; }
    .export-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 8px; padding: 12px 16px; margin-top: 14px; font-size: 13px; color: #fca5a5; line-height: 1.6; }

    /* ── Interview Screen ── */
    .iv-wrap { width: 100%; max-width: 1220px; display: flex; flex-direction: column; gap: 14px; }

    /* Status bar */
    .iv-statusbar { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .iv-status-left { display: flex; align-items: center; gap: 20px; }
    .rec-badge { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #ef4444; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink .9s ease-in-out infinite alternate; }
    .iv-timer { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; }
    .iv-timer.idle { color: #2d3446; }
    .iv-meta { font-size: 13px; color: #64748b; }
    .iv-meta strong { color: #94a3b8; }
    .iv-status-right { display: flex; align-items: center; gap: 10px; }
    .tab-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .tab-pill.ok   { color: #10b981; background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.2); }
    .tab-pill.warn { color: #fbbf24; background: rgba(234,179,8,.08); border: 1px solid rgba(234,179,8,.25); }
    .priv-note { font-size: 11px; color: #2d3446; background: #0d0f14; border: 1px solid #1e2330; padding: 3px 9px; border-radius: 20px; }

    /* Setup panel */
    .iv-setup-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 28px 32px; }
    .iv-setup-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .iv-setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .iv-setup-grid { grid-template-columns: 1fr; } }
    .setup-block { background: #0d0f14; border: 1px solid #1e2330; border-radius: 10px; padding: 20px; }
    .setup-block-title { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #6366f1; margin-bottom: 14px; }
    .room-link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .room-link-text { flex: 1; padding: 9px 12px; background: #12151d; border: 1px solid #1e2330; border-radius: 7px; font-size: 12px; color: #94a3b8; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .consent-text { font-size: 13px; color: #94a3b8; line-height: 1.7; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.15); border-radius: 8px; padding: 12px 14px; font-style: italic; }
    .setup-checklist { display: flex; flex-direction: column; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #64748b; }
    .check-box { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #2d3446; background: #0d0f14; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; transition: all .15s; }
    .check-box.checked { background: #10b981; border-color: #10b981; color: white; }
    .setup-footer { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .audio-note { font-size: 12px; color: #475569; }
    .audio-note strong { color: #fbbf24; }

    /* Interview body */
    .iv-body { display: grid; grid-template-columns: 1fr 340px; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .iv-body { grid-template-columns: 1fr; } }

    /* Video + transcript column */
    .iv-left { display: flex; flex-direction: column; gap: 14px; }
    .video-card { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .video-label { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; padding: 12px 18px 0; }
    .video-frame { width: 100%; height: 360px; border: none; display: block; }
    .transcript-card { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; padding: 20px; }
    .transcript-label { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .rec-live { font-size: 11px; color: #ef4444; display: flex; align-items: center; gap: 5px; }
    .rec-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; animation: blink .9s ease-in-out infinite alternate; }
    .transcript-body { min-height: 140px; max-height: 200px; overflow-y: auto; font-size: 14px; line-height: 1.85; color: #e2e8f0; }
    .transcript-final { color: #e2e8f0; }
    .transcript-interim { color: #475569; font-style: italic; }
    .transcript-empty { color: #2d3446; font-style: italic; font-size: 13px; }
    .word-count { font-size: 11px; color: #2d3446; margin-top: 8px; text-align: right; }

    /* Right panel */
    .iv-right { display: flex; flex-direction: column; gap: 14px; }
    .questions-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .panel-header { padding: 14px 16px; border-bottom: 1px solid #1e2330; }
    .panel-title { font-size: 11px; font-weight: 700; letter-spacing: .7px; color: #94a3b8; margin-bottom: 2px; }
    .panel-hint { font-size: 11px; color: #2d3446; }
    .questions-scroll { max-height: 320px; overflow-y: auto; }
    .q-sugg { padding: 12px 14px; border-bottom: 1px solid #1e2330; cursor: pointer; transition: background .15s; }
    .q-sugg:last-child { border-bottom: none; }
    .q-sugg:hover { background: #0d0f14; }
    .q-sugg.asked { opacity: .4; }
    .q-sugg.is-trap { border-left: 3px solid rgba(248,113,113,.5); }
    .q-sugg.is-dynamic-trap { border-left: 3px solid #f59e0b; background: rgba(245,158,11,.06); animation: trapPulse 1.5s ease-out 2; }
    @keyframes trapPulse { 0%,100% { background: rgba(245,158,11,.06); } 50% { background: rgba(245,158,11,.15); } }
    .q-sugg-text { font-size: 13px; color: #e2e8f0; line-height: 1.45; margin-bottom: 7px; }
    .q-sugg-text.crossed { text-decoration: line-through; color: #475569; }
    .q-sugg-foot { display: flex; align-items: center; justify-content: space-between; }
    .q-asked-mark { font-size: 10px; color: #10b981; font-weight: 700; }

    /* Dynamic Trap Banner */
    .trap-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; animation: trapBannerIn .4s ease-out; }
    @keyframes trapBannerIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: none; } }
    .trap-banner-left { display: flex; align-items: center; gap: 8px; }
    .trap-banner-icon { font-size: 18px; }
    .trap-banner-text { font-size: 12px; font-weight: 700; color: #f59e0b; }
    .trap-banner-sub { font-size: 11px; color: #92400e; margin-top: 1px; }
    .trap-banner-close { font-size: 16px; color: #78350f; cursor: pointer; padding: 2px 6px; border-radius: 4px; background: none; border: none; transition: color .2s; }
    .trap-banner-close:hover { color: #f59e0b; }

    /* Trap deployed badge in questions header */
    .trap-deployed-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #f59e0b; background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.3); padding: 2px 8px; border-radius: 12px; margin-left: 6px; animation: badgePop .3s ease-out; }
    @keyframes badgePop { from { transform: scale(0.7); opacity:0; } to { transform: scale(1); opacity:1; } }

    /* Trap generating spinner in questions sidebar */
    .trap-generating { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 12px; color: #f59e0b; border-bottom: 1px solid rgba(245,158,11,.2); background: rgba(245,158,11,.05); }
    .trap-spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(245,158,11,.3); border-top-color: #f59e0b; animation: spin .7s linear infinite; flex-shrink: 0; }

    /* Dynamic trap target hint */
    .q-trap-target { font-size: 10px; color: #78350f; margin-top: 4px; line-height: 1.4; }

    /* Notes panel */
    .notes-panel { background: #12151d; border: 1px solid #1e2330; border-radius: 14px; overflow: hidden; }
    .notes-textarea { width: 100%; min-height: 130px; background: #0d0f14; border: none; border-top: 1px solid #1e2330; padding: 14px 16px; color: #94a3b8; font-size: 13px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit; }
    .notes-textarea::placeholder { color: #2d3446; }

    /* Bottom bar */

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// Guard: pdf.js may fail to load from CDN — don't crash the whole script
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ── Constants ─────────────────────────────────────────────────────────────────
const TRAP_LABELS = {
  fake_tool: '🎣 Fake Tool', contradiction: '🔀 Contradiction',
  simplicity: '🧠 Simplicity', specificity: '🔍 Specificity', achievement_depth: '📊 Achievement Depth',
};

// ── Helpers ───────────────────────────────────────────────────────────────────
async function parsePDF(file) {
  const buf = await file.arrayBuffer();

  // Try progressively more lenient pdf.js options for non-standard PDFs
  const attempts = [
    { data: buf, verbosity: 0 },
    { data: buf, verbosity: 0, isEvalSupported: false, useSystemFonts: true },
    { data: buf, verbosity: 0, isEvalSupported: false, disableFontFace: true, useSystemFonts: true },
  ];

  let pdf = null;
  let lastErr = null;
  for (const opts of attempts) {
    try {
      pdf = await pdfjsLib.getDocument(opts).promise;
      break;
    } catch (e) {
      lastErr = e;
    }
  }

  if (!pdf) {
    const msg = lastErr?.message || 'Unknown PDF error';
    // Common non-standard PDF — give actionable guidance
    throw new Error(
      `Could not parse this PDF (${msg}). ` +
      'Please re-export it as PDF from Word, Google Docs, or Adobe Acrobat and try again.'
    );
  }

  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(x => x.str).join(' ') + '\n\n';
  }
  const extracted = text.trim();

  // ── Resume validation ──────────────────────────────────────────────────────
  if (extracted.length < 80) {
    throw new Error(
      'This PDF appears to be empty or image-only (no readable text was found). ' +
      'Please upload a text-based resume PDF. If your resume is scanned, convert it to text first.'
    );
  }

  const lower = extracted.toLowerCase();
  const resumeSignals = [
    'experience','education','skill','work','job','university','college',
    'degree','company','project','employment','career','qualification',
    'certif','linkedin','github','email','phone','summary','objective',
    'intern','engineer','developer','manager','analyst','designer',
    'bachelor','master','diploma','award','achievement','responsibility',
    'team','built','developed','managed','led','implemented','proficient'
  ];
  const hits = resumeSignals.filter(w => lower.includes(w)).length;

  if (hits < 3) {
    throw new Error(
      "This file doesn't look like a resume or CV (too few professional keywords found). " +
      "Please upload the candidate's actual resume PDF."
    );
  }

  return extracted;
}

async function generateQuestions(resumeText, role, company) {
  const contextPrefix = (role || company)
    ? `[INTERVIEW CONTEXT — Role: ${role || 'Not specified'} | Company: ${company || 'Not specified'}]\n\n`
    : '';
  const res = await fetch('/api/generate-questions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resume_text: contextPrefix + resumeText }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Error ${res.status}`); }
  return res.json();
}

async function scoreInterview(payload) {
  const res = await fetch('/api/score-interview', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Error ${res.status}`); }
  return res.json();
}

async function scoreTurn(answerText, turnNumber, latencyMs, longestSilenceMs, gazeDeviationsCount) {
  try {
    const res = await fetch('/api/score-turn', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        answer_text: answerText,
        turn_number: turnNumber,
        latency_ms: latencyMs != null ? Math.round(latencyMs) : null,
        longest_silence_ms: longestSilenceMs != null ? Math.round(longestSilenceMs) : null,
        gaze_deviations: gazeDeviationsCount || 0,
      }),
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

async function generateTrap(lastAnswers, role, resumeSnippet, suspicionNotes) {
  try {
    const res = await fetch('/api/generate-trap', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        last_answers: lastAnswers,
        role: role,
        resume_snippet: resumeSnippet,
        suspicion_notes: suspicionNotes,
      }),
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

function formatTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

function genSessionId() {
  return 'IAI-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
}

function genRoomId(name) {
  return 'IntegrityAI-' + (name||'Interview').replace(/[^a-zA-Z0-9]/g,'').toLowerCase() + '-' + Date.now().toString(36);
}

function scoreColor(s) { return s >= 70 ? 'score-green' : s >= 40 ? 'score-yellow' : 'score-red'; }
function fillClass(s)  { return s >= 70 ? 'fill-green'  : s >= 40 ? 'fill-yellow'  : 'fill-red'; }
function recClass(r)   { return r === 'proceed' ? 'rec-proceed' : r === 're-interview' ? 'rec-reinterview' : 'rec-donot'; }
function recLabel(r)   {
  return r === 'proceed' ? '✅ Proceed to Next Round'
       : r === 're-interview' ? '⚠️ Re-interview Recommended'
       : '🚫 Do Not Proceed';
}

function InterviewScreen({ questions, candidateName, company, sessionId, resumeText, onEnd }) {
  const [ivState, setIvState]               = useState('setup');
  const [elapsed, setElapsed]               = useState(0);
  const [displayText, setDisplayText]       = useState('');
  const [interim, setInterim]               = useState('');
  const [candidateTabSwitches, setCandidateTabSwitches] = useState(0);
  const [gazeDeviations, setGazeDeviations]             = useState(0);
  const remoteGazeCountRef = useRef(0);
  const [currentSpeaker, setCurrentSpeaker] = useState('candidate');
  const [turnScores, setTurnScores]         = useState([]); // [{score, flag, note}]
  const [liveScore, setLiveScore]           = useState(null);
  const [isScoring, setIsScoring]           = useState(false);
  const [askedIds, setAskedIds]             = useState(new Set());
  const [notes, setNotes]                   = useState('');
  const [analyseError, setAnalyseError]     = useState('');
  const [consentReady, setConsentReady]       = useState(false);
  const [consentAuto, setConsentAuto]         = useState(false); // true = came from candidate device
  const [monitorCopied, setMonitorCopied]   = useState(false);
  const [rightTab, setRightTab]             = useState('questions');
  const [currentTurnLatency, setCurrentTurnLatency] = useState(null);
  const [injectedTraps, setInjectedTraps]         = useState([]); // [{id, question, trap_type, target}]
  const [trapDeployed, setTrapDeployed]           = useState(false);
  const [trapBannerVisible, setTrapBannerVisible] = useState(false);
  const [isGeneratingTrap, setIsGeneratingTrap]   = useState(false);
  const trapFiredRef = useRef(false); // fire only once per session
  const turnCountRef = useRef(0);
  // Timing refs
  const candidateTurnStartRef = useRef(null);
  const firstWordReceivedRef  = useRef(false);
  const lastSpeechEventRef    = useRef(null);
  const longestSilenceRef     = useRef(0);

  const isRecordingRef  = useRef(false);
  const [micActive, setMicActive] = useState(false);  // true = recognizer currently listening
  const micActiveRef    = useRef(false);              // mirrors micActive for use inside closures
  const transcriptRef   = useRef('');
  const sessionFinalRef = useRef('');
  const speakerRef      = useRef('candidate');
  const timerRef        = useRef(null);
  const recRef          = useRef(null);
  const watchdogRef     = useRef(null);
  const bcRef           = useRef(null);
  const roomId          = useRef(genRoomId(candidateName));
  const wherebyUrl      = 'https://whereby.com/integrityai-demo?embed&skipMediaPermissionPrompt';
  const wherebyTabUrl   = 'https://whereby.com/integrityai-demo';
  // Auto speaker detection
  const localParticipantIdRef = useRef(null);
  const lastAutoSwitchRef     = useRef(0);
  const switchSpeakerRef      = useRef(null); // always points to latest switchSpeaker fn
  const isSwitchingRef        = useRef(false); // guards onresult/onend race on speaker switch
  const interimRef            = useRef('');    // mirrors interim state for sync access in switchSpeaker
  const candTxLastLenRef      = useRef(0);     // bytes of integrity_candtx_SESSION already consumed
  const transcriptCursorRef    = useRef(0);   // cursor for signal API transcript chunk polling (cross-machine)
  // ONE link for candidate — video call + tab monitoring
  const monitorUrl      = `${window.location.origin}?monitor=1&session=${sessionId}&room=${encodeURIComponent(roomId.current)}`;

  // Candidate tab-switch detection via BroadcastChannel (same-machine demo)
  useEffect(() => {
    let bc;
    try { bc = new BroadcastChannel('integrity-ai-signals'); bcRef.current = bc; } catch(e) {}
    if (bc) {
      bc.onmessage = (e) => {
        if (e.data?.session === sessionId) {
          if (e.data.type === 'tab_switch' || e.data.type === 'window_blur') {
            setCandidateTabSwitches(n => n + 1);
          }
          if (e.data.type === 'gaze_deviation') {
            const newCount = e.data.count || (remoteGazeCountRef.current + 1);
            if (newCount > remoteGazeCountRef.current) {
              const delta = newCount - remoteGazeCountRef.current;
              remoteGazeCountRef.current = newCount;
              setGazeDeviations(prev => prev + delta);
            }
          }
          if (e.data.type === 'consent_given') {
            setConsentReady(true);
            setConsentAuto(true);
          }
        }
      };
    }
    return () => { try { bc?.close(); } catch(e) {} };
  }, [sessionId]);

  // Cross-machine signal poll — consent + transcript chunks from candidate device (every 2s)
  useEffect(() => {
    const id = setInterval(async () => {
      try {
        const cursor = transcriptCursorRef.current;
        const res = await fetch(`/api/signal?session=${sessionId}&cursor=${cursor}`);
        if (!res.ok) return;
        const data = await res.json();

        // Consent
        if (data.consent_given) { setConsentReady(true); setConsentAuto(true); }

        // Transcript chunks pushed by candidate device via signal API (cross-machine path)
        if (data.transcript_chunks && data.transcript_chunks.length > 0 && isRecordingRef.current) {
          transcriptCursorRef.current = data.next_cursor;
          const newText = data.transcript_chunks.map(c => c.text).join(' ').trim();
          if (!newText || newText.split(' ').length < 2) return;
          // Commit any in-progress interviewer speech first
          if (sessionFinalRef.current.trim()) {
            transcriptRef.current += sessionFinalRef.current;
            sessionFinalRef.current = '';
          }
          transcriptRef.current += '\n[CANDIDATE]: ' + newText + '\n[INTERVIEWER]: ';
          speakerRef.current = 'interviewer';
          setCurrentSpeaker('interviewer');
          setDisplayText(transcriptRef.current);
          // Score this candidate turn
          if (newText.split(' ').length >= 5) {
            turnCountRef.current += 1;
            const turnNum = turnCountRef.current;
            setIsScoring(true);
            scoreTurn(newText, turnNum, null, null, gazeDeviations).then(result => {
              setIsScoring(false);
              if (result && typeof result.suspicion_score === 'number') {
                setTurnScores(prev => [...prev, {
                  score: result.suspicion_score, flag: result.flag, note: result.note,
                  turn: turnNum, latency_ms: null, silence_ms: null, answer_text: newText,
                }]);
                setLiveScore(result.suspicion_score);
              }
            });
          }
        }
      } catch {}
    }, 2000);
    return () => clearInterval(id);
  }, [sessionId]);

  // Candidate transcript poller — picks up speech captured on the candidate's own device
  // CandidateMonitor pushes finals to localStorage key: integrity_candtx_SESSION
  // We read it every 500ms and insert new text live into the interview transcript
  useEffect(() => {
    const pollId = setInterval(() => {
      if (!isRecordingRef.current) return;
      try {
        // Read gaze deviations reported by candidate device
        const gazeKey = 'integrity_gaze_' + sessionId;
        const remoteGaze = parseInt(localStorage.getItem(gazeKey) || '0', 10);
        if (remoteGaze > remoteGazeCountRef.current) {
          const delta = remoteGaze - remoteGazeCountRef.current;
          remoteGazeCountRef.current = remoteGaze;
          setGazeDeviations(prev => prev + delta);
        }
      } catch {}
      try {
        const key = 'integrity_candtx_' + sessionId;
        const full = localStorage.getItem(key) || '';
        if (full.length <= candTxLastLenRef.current) return;
        const newText = full.slice(candTxLastLenRef.current).trim();
        candTxLastLenRef.current = full.length;
        if (!newText) return;

        // Commit any in-progress interviewer speech first (so we don't interleave)
        if (sessionFinalRef.current.trim()) {
          transcriptRef.current += sessionFinalRef.current;
          sessionFinalRef.current = '';
        }
        // Insert candidate block — close with newline so next interviewer label is on its own line
        transcriptRef.current += '\n[CANDIDATE]: ' + newText + '\n[INTERVIEWER]: ';
        speakerRef.current = 'interviewer';
        setCurrentSpeaker('interviewer');
        setDisplayText(transcriptRef.current);

        // Score this candidate turn if it's long enough
        if (newText.split(' ').length >= 5) {
          turnCountRef.current += 1;
          const turnNum = turnCountRef.current;
          setIsScoring(true);
          scoreTurn(newText, turnNum, null, null, gazeDeviations).then(result => {
            setIsScoring(false);
            if (result && typeof result.suspicion_score === 'number') {
              setTurnScores(prev => {
                const updated = [...prev, {
                  score: result.suspicion_score, flag: result.flag, note: result.note, turn: turnNum,
                  latency_ms: null, silence_ms: null, answer_text: newText,
                }];
                // Dynamic Trap: 2 consecutive turns > 55
                if (!trapFiredRef.current && updated.length >= 2) {
                  const last2 = updated.slice(-2);
                  if (last2[0].score > 55 && last2[1].score > 55) {
                    trapFiredRef.current = true;
                    const lastAnswers = last2.map(t => t.answer_text).filter(Boolean);
                    const notes2 = last2.map(t => t.note).filter(Boolean).join('; ');
                    setIsGeneratingTrap(true);
                    generateTrap(lastAnswers, candidateName, resumeText ? resumeText.substring(0, 400) : '', notes2)
                      .then(trap => {
                        setIsGeneratingTrap(false);
                        if (trap && trap.question) {
                          setInjectedTraps(t => [{ id: `trap-dynamic-${Date.now()}`, question: trap.question, trap_type: trap.trap_type || 'pressure', target: trap.target || '', category: 'trap', dynamic: true }, ...t]);
                          setTrapDeployed(true);
                          setTrapBannerVisible(true);
                          setRightTab('questions');
                        }
                      });
                  }
                }
                return updated;
              });
              setLiveScore(result.suspicion_score);
            }
          });
        }
      } catch(_e) { /* localStorage unavailable */ }
    }, 500);
    return () => clearInterval(pollId);
  }, [sessionId, candidateName, resumeText]);

  const startSpeech = () => {
    if (!isRecordingRef.current) return;
    // Abort any existing recognizer before creating a new one.
    // This prevents double-restart: onerror schedules restart at 600ms,
    // onend fires right after and schedules at 300ms — without this guard
    // two recognizers run simultaneously and duplicate every word.
    try {
      if (recRef.current) {
        recRef.current.onend = null;   // prevent the dying recognizer from triggering another restart
        recRef.current.onerror = null;
        recRef.current.abort();
      }
    } catch(_e) {}
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    sessionFinalRef.current = '';
    rec.onresult = (e) => {
      let finals = ''; let interimTxt = '';
      // Use e.resultIndex so we only re-scan new results, not the entire accumulated list
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finals += e.results[i][0].transcript + ' ';
        else interimTxt += e.results[i][0].transcript;
      }
      // Accumulate finals for this session (don't replace — append to what we already have)
      sessionFinalRef.current += finals;
      interimRef.current = interimTxt;   // sync for switchSpeaker to read without closure-stale issues
      setInterim(interimTxt);
      setDisplayText(transcriptRef.current + sessionFinalRef.current + interimTxt);
      // Timing: latency to first word + longest mid-answer silence
      if (speakerRef.current === 'candidate') {
        const now = Date.now();
        if (!firstWordReceivedRef.current && candidateTurnStartRef.current) {
          firstWordReceivedRef.current = true;
          setCurrentTurnLatency(now - candidateTurnStartRef.current);
        }
        if (lastSpeechEventRef.current) {
          const gap = now - lastSpeechEventRef.current;
          if (gap > longestSilenceRef.current) longestSilenceRef.current = gap;
        }
        lastSpeechEventRef.current = now;
      }
    };
    rec.onend = () => {
      // Normal auto-end (browser silence timeout) — commit what we have
      // Speaker switches no longer call rec.stop(), so this only fires on natural end
      micActiveRef.current = false; setMicActive(false);
      if (sessionFinalRef.current.trim()) {
        transcriptRef.current += sessionFinalRef.current;
      }
      sessionFinalRef.current = '';
      interimRef.current = '';
      setInterim('');
      setDisplayText(transcriptRef.current);
      if (isRecordingRef.current) setTimeout(startSpeech, 300);
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed') {
        alert('Microphone access denied. Please allow microphone access and reload.');
        stopRecording();
        return;
      }
      // All other errors (network, no-speech, aborted, audio-capture) are recoverable.
      // onend fires after onerror in most browsers and will restart via the onend handler.
      // Force restart here as a safety net for browsers where onend doesn't fire.
      if (isRecordingRef.current) {
        setTimeout(startSpeech, 600);
      }
    };
    recRef.current = rec;
    rec.start();
    micActiveRef.current = true; setMicActive(true);
  };

  const startRecording = () => {
    const hasSR = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
    if (!hasSR) { alert('Live transcription requires Google Chrome. Please open this page in Chrome.'); return; }
    // Clear any stale candidate transcript from a previous session
    try { localStorage.removeItem('integrity_candtx_' + sessionId); } catch(_e) {}
    candTxLastLenRef.current = 0;
    // Start as INTERVIEWER — interviews begin with the interviewer asking the first question
    transcriptRef.current = '[INTERVIEWER]: ';
    speakerRef.current = 'interviewer';
    setCurrentSpeaker('interviewer');
    setDisplayText('[INTERVIEWER]: ');
    isRecordingRef.current = true;
    setIvState('recording');
    timerRef.current = setInterval(() => setElapsed(n=>n+1), 1000);
    startSpeech();
    // Smart watchdog: only restart if NO speech activity for 15s (not mid-speech)
    // lastSpeechEventRef is updated on every onresult — so this only fires if recognizer is truly dead
    if (watchdogRef.current) clearInterval(watchdogRef.current);
    watchdogRef.current = setInterval(() => {
      if (!isRecordingRef.current) { clearInterval(watchdogRef.current); watchdogRef.current = null; return; }
      const lastActivity = lastSpeechEventRef.current || 0;
      const silentMs = Date.now() - lastActivity;
      // Only restart if silent for > 15s AND mic is showing inactive — avoids cutting off live speech
      // Use micActiveRef (not micActive state) — state is stale inside setInterval closure
      if (silentMs > 15000 && !micActiveRef.current) {
        try { if (recRef.current) recRef.current.abort(); } catch(_e) {}
      }
    }, 5000);
  };

  // Toggle speaker — commits current session text, scores candidate turns
  const switchSpeaker = async (spk) => {
    // Promote any pending interim FIRST — words spoken right before the click are still "interim"
    // and would be lost without this. We grab them synchronously via interimRef (not stale state).
    const pendingInterim = interimRef.current.trim();
    if (pendingInterim) {
      sessionFinalRef.current += pendingInterim + ' ';
      interimRef.current = '';
      setInterim('');
    }
    // Commit whatever is in the current session to the full transcript
    if (sessionFinalRef.current.trim()) {
      transcriptRef.current += sessionFinalRef.current;
    }
    sessionFinalRef.current = '';
    setInterim('');

    // If switching AWAY from candidate, capture timing + score that turn
    if (speakerRef.current === 'candidate' && spk !== 'candidate') {
      const capturedLatency = currentTurnLatency;
      const capturedSilence = longestSilenceRef.current > 0 ? longestSilenceRef.current : null;
      const lines = transcriptRef.current.split('\n');
      const lastCandLine = [...lines].reverse().find(l => l.startsWith('[CANDIDATE]: '));
      const turnText = lastCandLine ? lastCandLine.replace('[CANDIDATE]: ', '').trim() : '';
      if (turnText.split(' ').length >= 5) {
        turnCountRef.current += 1;
        const turnNum = turnCountRef.current;
        const capturedTurnText = turnText; // capture for trap use
        setIsScoring(true);
        scoreTurn(turnText, turnNum, capturedLatency, capturedSilence, gazeDeviations).then(result => {
          setIsScoring(false);
          if (result && typeof result.suspicion_score === 'number') {
            setTurnScores(prev => {
              const updated = [...prev, {
                score: result.suspicion_score, flag: result.flag, note: result.note, turn: turnNum,
                latency_ms: capturedLatency, silence_ms: capturedSilence,
                answer_text: capturedTurnText,
              }];
              // ── Dynamic Trap Trigger ──
              // Fire once per session when 2 consecutive turns score > 55
              if (!trapFiredRef.current && updated.length >= 2) {
                const last2 = updated.slice(-2);
                if (last2[0].score > 55 && last2[1].score > 55) {
                  trapFiredRef.current = true;
                  const lastAnswers = last2.map(t => t.answer_text).filter(Boolean);
                  const notes = last2.map(t => t.note).filter(Boolean).join('; ');
                  setIsGeneratingTrap(true);
                  generateTrap(lastAnswers, candidateName, resumeText ? resumeText.substring(0, 400) : '', notes)
                    .then(trap => {
                      setIsGeneratingTrap(false);
                      if (trap && trap.question) {
                        const trapEntry = {
                          id: `trap-dynamic-${Date.now()}`,
                          question: trap.question,
                          trap_type: trap.trap_type || 'pressure',
                          target: trap.target || '',
                          category: 'trap',
                          dynamic: true,
                        };
                        setInjectedTraps(t => [trapEntry, ...t]);
                        setTrapDeployed(true);
                        setTrapBannerVisible(true);
                        setRightTab('questions'); // auto-switch to questions tab
                      }
                    });
                }
              }
              return updated;
            });
            setLiveScore(result.suspicion_score);
          }
        });
      }
    }

    // Switching TO candidate → start timing clock
    if (spk === 'candidate') {
      candidateTurnStartRef.current = Date.now();
      firstWordReceivedRef.current  = false;
      lastSpeechEventRef.current    = null;
      longestSilenceRef.current     = 0;
      setCurrentTurnLatency(null);
    }

    // Only add new speaker label — skip if the previous turn was empty (avoids "[CANDIDATE]: \n[INTERVIEWER]: " blanks)
    // Check: does the transcript currently end with a label that has nothing after it?
    const trimmed = transcriptRef.current.trimEnd();
    const endsWithEmptyLabel = trimmed.endsWith('[INTERVIEWER]:') || trimmed.endsWith('[CANDIDATE]:');
    if (!endsWithEmptyLabel) {
      // Previous turn had content — close it and open new label
      const label = spk === 'interviewer' ? '\n[INTERVIEWER]: ' : '\n[CANDIDATE]: ';
      transcriptRef.current += label;
    } else {
      // Replace the empty label with the new one (don't stack two empty labels)
      const label = spk === 'interviewer' ? '[INTERVIEWER]: ' : '[CANDIDATE]: ';
      transcriptRef.current = transcriptRef.current.trimEnd().replace(/\[(?:INTERVIEWER|CANDIDATE)\]:\s*$/, label);
    }
    speakerRef.current = spk;
    setCurrentSpeaker(spk);
    setDisplayText(transcriptRef.current);

    // KEY: Do NOT call rec.stop() here — stopping causes a 300-500ms gap where all speech is lost.
    // Instead we keep recognition running continuously and only change the speaker label.
    // The onresult handler will attribute new finals to the current speakerRef value via transcriptRef.
  };

  const stopRecording = () => {
    isRecordingRef.current = false;
    clearInterval(timerRef.current);
    if (watchdogRef.current) { clearInterval(watchdogRef.current); watchdogRef.current = null; }
    recRef.current?.stop();
    // Promote any pending interim before final commit
    const pendingInterim = interimRef.current.trim();
    if (pendingInterim) sessionFinalRef.current += pendingInterim + ' ';
    if (sessionFinalRef.current.trim()) transcriptRef.current += sessionFinalRef.current;
    sessionFinalRef.current = '';
    interimRef.current = '';
    setInterim('');
    setDisplayText(transcriptRef.current);
  };

  const handleEndAndAnalyse = async () => {
    stopRecording();
    setIvState('analysing');
    setAnalyseError('');
    try {
      const trapQuestions = questions.filter(q=>q.trap_type).map(q=>q.question);
      const fullTranscript = transcriptRef.current;
      // Extract only candidate speech for AI scoring
      const candidateLines = fullTranscript
        .split('\n')
        .filter(line => line.startsWith('[CANDIDATE]: '))
        .map(line => line.replace('[CANDIDATE]: ', '').trim())
        .filter(Boolean);
      const candidateText = candidateLines.join(' ');
      // Use candidate-only text, fallback to full transcript, fallback to placeholder
      const transcriptForAI = candidateText.trim().length > 20
        ? candidateText
        : fullTranscript.trim().length > 20
          ? fullTranscript
          : '[No speech was recorded during this session — manual review required]';
      const report = await scoreInterview({
        transcript: transcriptForAI,
        candidate_name: candidateName,
        trap_questions: trapQuestions,
        tab_switches: candidateTabSwitches,
        duration_seconds: elapsed,
        role: company || '',
        interviewer_notes: notes,
        resume_text: resumeText || '',
      });
      onEnd({ transcript: fullTranscript, candidateTranscript: candidateText, tabSwitches: candidateTabSwitches, gazeDeviations, elapsed, notes, report, turnScores, injectedTraps });
    } catch (err) {
      setAnalyseError('Analysis failed: ' + err.message + ' — check your internet connection and try again.');
      setIvState('report-error');
    }
  };

  const meterClass = (s) => s === null ? '' : s <= 40 ? 'low' : s <= 70 ? 'medium' : 'high';

  const copyMonitor = () => { navigator.clipboard.writeText(monitorUrl); setMonitorCopied(true); setTimeout(()=>setMonitorCopied(false),2500); };
  const toggleAsked = (id) => setAskedIds(prev => { const s=new Set(prev); s.has(id)?s.delete(id):s.add(id); return s; });
  // Count only candidate words for display
  const candidateLines = displayText.split('\n').filter(l=>l.startsWith('[CANDIDATE]: ')).map(l=>l.replace('[CANDIDATE]: ','')).join(' ');
  const wordCount = candidateLines.trim() ? candidateLines.trim().split(/\s+/).length : 0;

  // ── Analysing state ──
  if (ivState === 'report-error') return (
    <div className="loading-card">
      <div style={{fontSize:40,marginBottom:16}}>⚠️</div>
      <div className="loading-title" style={{color:'#ef4444'}}>Analysis Failed</div>
      <div className="error-box" style={{marginTop:16,textAlign:'left'}}>{analyseError}</div>
      <div style={{display:'flex',gap:12,marginTop:24,justifyContent:'center'}}>
        <button className="btn btn-primary" onClick={()=>{ setIvState('recording'); setAnalyseError(''); }}>↩ Return to Interview</button>
        <button className="btn btn-danger" onClick={()=>{ setAnalyseError(''); handleEndAndAnalyse(); }}>🔄 Retry Analysis</button>
      </div>
    </div>
  );

  if (ivState === 'analysing') return (
    <AnalysingScreen analyseError={analyseError} />
  );
