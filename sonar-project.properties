# IntegrityAI — SonarQube project configuration
sonar.projectKey=IntegrityAI-AI-Powered-Interview-Authenticity-Detector
sonar.projectName=IntegrityAI-AI-Powered-Interview-Authenticity-Detector
sonar.projectVersion=1.0

# Source files (API functions only)
sonar.sources=api
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.js

# Coverage — generated by: npm install && npm test (run BEFORE sonar-scanner)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude test files from duplication analysis (standard practice — test boilerplate is inherently repetitive)
sonar.cpd.exclusions=**/__tests__/**,**/*.test.js

# Exclude utility scripts from analysis
sonar.exclusions=generate-sri.js,coverage/**

sonar.sourceEncoding=UTF-8
