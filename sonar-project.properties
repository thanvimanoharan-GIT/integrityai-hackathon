# IntegrityAI — SonarQube project configuration
sonar.projectKey=IntegrityAI-AI-Powered-Interview-Authenticity-Detector
sonar.projectName=IntegrityAI-AI-Powered-Interview-Authenticity-Detector
sonar.projectVersion=1.0

# Source files (API functions only — not test files)
sonar.sources=api
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.js

# Coverage report — generated by: npm test
# Jest writes lcov.info to coverage/lcov.info by default
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude utility scripts and config from analysis
sonar.exclusions=generate-sri.js,coverage/**
